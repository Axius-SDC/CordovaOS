  (dm_x250838l7oi6l3yavg9twc1i:DataModel { id: 'dm-x250838l7oi6l3yavg9twc1i', label: 'Business Registry', sdcType: 'DataModel', description: 'Maintain the authoritative registry of business entities in Cordova.', dcSubject: 'Business Registry', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_og2caskrf2nq0sszcztp3avx:Cluster:SDC4Component { id: 'mc-og2caskrf2nq0sszcztp3avx', label: 'Business Registry Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed business-registry record in CordovaOS: a registered business entity and its statutory filings. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_l69byv9b04bedudm59pfclvw:Cluster:SDC4Component { id: 'mc-l69byv9b04bedudm59pfclvw', label: 'Business Registry Office', sdcType: 'Cluster', description: 'Details cluster for the government office maintaining the business registry. W3C PROV-DM Agent (Organization).' }),
  (comp_ule5u2z3rjpa9pooaifwj1n3:XdString:SDC4Component { id: 'mc-ule5u2z3rjpa9pooaifwj1n3', label: 'organization_identifier', sdcType: 'XdString', seq: '0000', description: 'Official identifier for the organization (e.g., DUNS, tax ID).', minLength: '1', maxLength: '255' }),
  (comp_ifw5zfe4oiijbxjn1ylc2wm3:XdString:SDC4Component { id: 'mc-ifw5zfe4oiijbxjn1ylc2wm3', label: 'organization_name', sdcType: 'XdString', seq: '0000', description: 'Legal or official name of the organization.', minLength: '1', maxLength: '200' }),
  (comp_bpqtzla39dwentygpwea8276:XdToken:SDC4Component { id: 'mc-bpqtzla39dwentygpwea8276', label: 'organization_type', sdcType: 'XdToken', seq: '0000', description: 'Type of organization.', enumerations: 'corporation; government; nonprofit; academic; department; vendor' }),
  (comp_nesxtz8c5o665swc9lhvqkjj:XdToken:SDC4Component { id: 'mc-nesxtz8c5o665swc9lhvqkjj', label: 'PROV Agent Type', sdcType: 'XdToken', seq: '0000', description: 'Classification of agents responsible for activities and entities in W3C PROV-DM. Agents bear responsibility for activities and entity generation.', enumerations: 'Person; Organization; SoftwareAgent' }),
  (cluster_hdhjfg00tngir2txgqyka9cv:Cluster:SDC4Component { id: 'mc-hdhjfg00tngir2txgqyka9cv', label: 'Provenance Components', sdcType: 'Cluster', description: 'Cluster for Provenance Components' }),
  (comp_m9xg6e182m1oq77ssrf9iujv:XdString:SDC4Component { id: 'mc-m9xg6e182m1oq77ssrf9iujv', label: 'activity_description', sdcType: 'XdString', seq: '0000', description: 'Detailed description of what this activity does and its purpose.', minLength: '1', maxLength: '2000' }),
