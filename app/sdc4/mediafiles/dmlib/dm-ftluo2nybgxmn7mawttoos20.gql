  // --- Model-enriched structural data ---
  (dm_ftluo2nybgxmn7mawttoos20:DataModel { id: 'dm-ftluo2nybgxmn7mawttoos20', label: 'Healthcare Record', sdcType: 'DataModel', description: 'Maintain basic medical records for all persons in Cordova.', dcSubject: 'Healthcare Record', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_w0lu0us3nbxaedfum9i8itpc:Cluster:SDC4Component { id: 'mc-w0lu0us3nbxaedfum9i8itpc', label: 'Healthcare Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed healthcare record in CordovaOS: an individual\'s clinical and health information. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_ygtbvvmzcw3ukfsg3axqry97:Cluster:SDC4Component { id: 'mc-ygtbvvmzcw3ukfsg3axqry97', label: 'Patient Record', sdcType: 'Cluster', description: 'A person\'s medical record in the Cordova healthcare system.\nBusiness Context: Links to Civil Registry via National ID. All clinical cells carry Restricted:PatientCare policy.\nPurpose: Comprehensive medical record for a Cordova resident' }),
  (comp_nj7s1gk45tfgyooxpz0qaha3:XdString:SDC4Component { id: 'mc-nj7s1gk45tfgyooxpz0qaha3', label: 'National ID (CID)', sdcType: 'XdString', seq: '0000', description: 'Cordova National Identity Number. Format: COR-PPCC-NNNNNN where PP is the two-letter province code (AL=Aldara, BR=Brevina, CE=Celara), CC is the two-digit city code (01-03), and NNNNNN is a six-digit sequence number. Issued at birth or naturalization. Required for all government transactions.', exactLength: '16', pattern: 'COR-(AL|BR|CE)0[1-3]-[0-9]{6}' }),
