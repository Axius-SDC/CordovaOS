  (dm_uika42uwtj3ijdbegzw2kcwq:DataModel { id: 'dm-uika42uwtj3ijdbegzw2kcwq', label: 'Civil Registry', sdcType: 'DataModel', description: 'Maintain the authoritative identity record for every person in Cordova.', dcSubject: 'Civil Registry', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_aan7382wp8e2f58m9a2hvmkp:Cluster:SDC4Component { id: 'mc-aan7382wp8e2f58m9a2hvmkp', label: 'Civil Registry Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed civil-registry record in CordovaOS: a person\'s civil-status events such as births, marriages, and deaths. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_bgjt4mvgvkxcn6hurg37u21b:Cluster:SDC4Component { id: 'mc-bgjt4mvgvkxcn6hurg37u21b', label: 'Civil Registry Record', sdcType: 'Cluster', description: 'A complete civil registry entry for one person. This is the anchor node in the Cordova graph — the Person cell that every other domain references.\nBusiness Context: Authoritative source of truth for all government identity verification\nPurpose: Complete identity record for a Cordova resident' }),
  (comp_nj7s1gk45tfgyooxpz0qaha3:XdString:SDC4Component { id: 'mc-nj7s1gk45tfgyooxpz0qaha3', label: 'National ID (CID)', sdcType: 'XdString', seq: '0000', description: 'Cordova National Identity Number. Format: COR-PPCC-NNNNNN where PP is the two-letter province code (AL=Aldara, BR=Brevina, CE=Celara), CC is the two-digit city code (01-03), and NNNNNN is a six-digit sequence number. Issued at birth or naturalization. Required for all government transactions.', exactLength: '16', pattern: 'COR-(AL|BR|CE)0[1-3]-[0-9]{6}' }),
  (comp_cfg2l8ym4ve833ritrxu765t:XdString:SDC4Component { id: 'mc-cfg2l8ym4ve833ritrxu765t', label: 'Country of Birth', sdcType: 'XdString', seq: '0000', description: 'Country where participant was born', minLength: '1', maxLength: '200' }),
  (comp_kfyzf8u8gdafcpt5kfh2qg3q:XdString:SDC4Component { id: 'mc-kfyzf8u8gdafcpt5kfh2qg3q', label: 'Given Name (Person)', sdcType: 'XdString', seq: '0000', description: 'name typically used to differentiate people from the same family, clan, or other social group who have a common last name\naka. first name or forename', minLength: '1', maxLength: '100' }),
  (comp_oit0ueglhjfcyq80z22kl2z3:XdString:SDC4Component { id: 'mc-oit0ueglhjfcyq80z22kl2z3', label: 'Middle Name (Person)', sdcType: 'XdString', seq: '0000', description: 'Middle or other name(s) given to identify a person', minLength: '1', maxLength: '100' }),
  (comp_v8jgjo2sml12jo7zrb8swoxi:XdString:SDC4Component { id: 'mc-v8jgjo2sml12jo7zrb8swoxi', label: 'Surname (Person)', sdcType: 'XdString', seq: '0000', description: 'The surname or family name of a person, part of a naming scheme for individuals, used in many cultures worldwide\r\naka: last name, fam name, family surname, surname, clan name', minLength: '1', maxLength: '100' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_vjfgimlbb90ds2xg55tfn941:XdToken:SDC4Component { id: 'mc-vjfgimlbb90ds2xg55tfn941', label: 'Marital Status (Cordova)', sdcType: 'XdToken', seq: '0000', description: 'Marital status as recorded in the Cordova Civil Registry. Aligned with vital statistics records.', enumerations: 'Single; Married; Divorced; Widowed; Separated' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
  (comp_cymq16em5zb20whgtfzki6n5:XdToken:SDC4Component { id: 'mc-cymq16em5zb20whgtfzki6n5', label: 'Gender Identity', sdcType: 'XdToken', seq: '0000', description: 'Self-reported gender identity of the participant', enumerations: 'Male; Female; Transgender male; Transgender female; Non-binary; Genderqueer; Other; Prefer not to answer; Unknown' }),
  (comp_mw9qdn71urog8egjbp5t3y00:XdToken:SDC4Component { id: 'mc-mw9qdn71urog8egjbp5t3y00', label: 'Sex', sdcType: 'XdToken', seq: '0000', description: 'Biological sex assigned at birth based on physical characteristics. UMLS CUI: C0079399 (Biologic Sex). Aligned with OMB standards for reporting.', enumerations: 'Male; Female; Intersex; Unknown' }),
  (comp_g3k6bj8su3rvkszg2700dhyh:XdTemporal:SDC4Component { id: 'mc-g3k6bj8su3rvkszg2700dhyh', label: 'Birth Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date of birth of the participant. UMLS CUI: C0421451 (Date of birth). LOINC: 21112-8 (Birth date).' }),
  (cluster_sv48g8am8vqs46nodiugripz:Cluster:SDC4Component { id: 'mc-sv48g8am8vqs46nodiugripz', label: 'Contact Information', sdcType: 'Cluster', description: 'Phone, email, and preferred contact method for the person.\nPurpose: Enable government communication with the person\nParent Cluster: Civil Registry Record' }),
  (comp_x0na649n17if0ukul82cmrx3:XdString:SDC4Component { id: 'mc-x0na649n17if0ukul82cmrx3', label: 'Cordova Email Address', sdcType: 'XdString', seq: '0000', description: 'Email address using one of the Cordova national email providers. Providers: cordomail.co, novamail.co, portocorreo.co', minLength: '5', maxLength: '254', pattern: '[-a-zA-Z0-9._%+]+@(cordomail|novamail|portocorreo)\\.co' }),
  (comp_nfrvvp87c5imu5h9ups92kgy:XdString:SDC4Component { id: 'mc-nfrvvp87c5imu5h9ups92kgy', label: 'Cordova Phone Number', sdcType: 'XdString', seq: '0000', description: 'Cordova national telephone number. Format: +99-PPP-NNN-NNNN where +99 is the country code and PPP is the area code. Area codes: Porto Sereno=100, Vistamar=110, Rioseco=120, Campoluz=200, Tierraverde=210, Montecara=220, Novaciudad=300, Piedrasol=310, Lagunavista=320.', exactLength: '16', pattern: '\\+99-[123][012]0-[0-9]{3}-[0-9]{4}' }),
  (comp_zlz64jydsmhb5zmytcm2ewyg:XdToken:SDC4Component { id: 'mc-zlz64jydsmhb5zmytcm2ewyg', label: 'Preferred Contact Method', sdcType: 'XdToken', seq: '0000', description: 'Participant\'s preferred method of contact', enumerations: 'Phone; Email; Text/SMS; Mail; No preference' }),
  (cluster_ytctcqbr30kxsmvx4jk7lae2:Cluster:SDC4Component { id: 'mc-ytctcqbr30kxsmvx4jk7lae2', label: 'Current Address', sdcType: 'Cluster', description: 'The person\'s current residential address within Cordova.\nPurpose: Current residential address for correspondence and jurisdiction determination\nParent Cluster: Civil Registry Record' }),
  (comp_l338k7nlvnq2am0owa19yxfc:XdString:SDC4Component { id: 'mc-l338k7nlvnq2am0owa19yxfc', label: 'Address (Line 1)', sdcType: 'XdString', seq: '0000', description: 'Street address line, building/apartment number, or P.O. Box number.', maxLength: '200' }),
  (comp_ek5h6dsqpd9kz0l4mcckmxpt:XdString:SDC4Component { id: 'mc-ek5h6dsqpd9kz0l4mcckmxpt', label: 'Address (Line 2)', sdcType: 'XdString', seq: '0000', description: 'Street address line, building/apartment number, or P.O. Box number.', maxLength: '200' }),
  (cluster_l9k2fmlc5vn477r3kpi1ufal:Cluster:SDC4Component { id: 'mc-l9k2fmlc5vn477r3kpi1ufal', label: 'Family Relationships', sdcType: 'Cluster', description: 'Links between persons in the Civil Registry. Each relationship record connects two National IDs.\nBusiness Context: Enables cross-person queries (family units, next of kin, guardianship)\nPurpose: Record familial and legal relationships between persons\nParent Cluster: Civil Registry Record', asserts: 'not(v7w25a7yp2udtb6tgaxzy107/xdtemporal-date) or coz5qatu0oogj3s2jetx1lja/xdtemporal-date le v7w25a7yp2udtb6tgaxzy107/xdtemporal-date' }),
  (comp_be9apjt8mvjjv86qzycorcjl:XdToken:SDC4Component { id: 'mc-be9apjt8mvjjv86qzycorcjl', label: 'Relationship Type', sdcType: 'XdToken', seq: '0000', description: 'Familial or legal relationship between two persons in the Cordova Civil Registry.', enumerations: 'Spouse; Parent; Child; Sibling; Grandparent; Grandchild; Guardian' }),
  (comp_o7vjxwswi0pxo543hq504jjx:XdTemporal:SDC4Component { id: 'mc-o7vjxwswi0pxo543hq504jjx', label: 'Relationship End Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the relationship ended, if applicable (e.g., divorce date, death date). Null for active relationships.' }),
  (comp_k9ptlhkq3j41p6umlg3tc80x:XdTemporal:SDC4Component { id: 'mc-k9ptlhkq3j41p6umlg3tc80x', label: 'Relationship Start Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the relationship was established or recorded (e.g., marriage date, birth date of child, guardianship order date)\n\n---' }),
  (cluster_hdhjfg00tngir2txgqyka9cv:Cluster:SDC4Component { id: 'mc-hdhjfg00tngir2txgqyka9cv', label: 'Provenance Components', sdcType: 'Cluster', description: 'Cluster for Provenance Components' }),
  (comp_m9xg6e182m1oq77ssrf9iujv:XdString:SDC4Component { id: 'mc-m9xg6e182m1oq77ssrf9iujv', label: 'activity_description', sdcType: 'XdString', seq: '0000', description: 'Detailed description of what this activity does and its purpose.', minLength: '1', maxLength: '2000' }),
  (comp_ccj1yq2wtwknobszkgzzdbtr:XdString:SDC4Component { id: 'mc-ccj1yq2wtwknobszkgzzdbtr', label: 'prov_activity_type', sdcType: 'XdString', seq: '0000', description: 'Type of activity from the W3C Activity Streams 2.0 vocabulary. Describes what was done to the data.', minLength: '1', maxLength: '200' }),
  (comp_bd3s8t23d6m3zizmpwavc32y:XdString:SDC4Component { id: 'mc-bd3s8t23d6m3zizmpwavc32y', label: 'system_identifier', sdcType: 'XdString', seq: '0000', description: 'Identifier of the system that handled the data. Maps to prov:Entity context in the PROV-O export. This is the AuditType.system-id field.', minLength: '1', maxLength: '50' }),
  (comp_zr59goe24qkocprl3feul3mt:XdString:SDC4Component { id: 'mc-zr59goe24qkocprl3feul3mt', label: 'system_location_identifier', sdcType: 'XdString', seq: '0000', description: 'Code or identifier for the system location. Used for cross-system location resolution.', minLength: '1', maxLength: '50' }),
  (comp_fnodzqkbyskwe7nh58rs336k:XdString:SDC4Component { id: 'mc-fnodzqkbyskwe7nh58rs336k', label: 'system_location_name', sdcType: 'XdString', seq: '0000', description: 'Name of the physical or logical location where the system resides. Maps to prov:atLocation.', minLength: '1', maxLength: '100' }),
  (comp_edvvjznmaoibzmfna0uuoo37:XdTemporal:SDC4Component { id: 'mc-edvvjznmaoibzmfna0uuoo37', label: 'activity_timestamp_end', sdcType: 'XdTemporal', seq: '0000', description: 'When the provenance activity completed. Maps to prov:endedAtTime. ISO 8601 format.' }),
  (comp_o72s5793973fzho35rnaughs:XdTemporal:SDC4Component { id: 'mc-o72s5793973fzho35rnaughs', label: 'activity_timestamp_start', sdcType: 'XdTemporal', seq: '0000', description: 'When the provenance activity began. Maps to prov:startedAtTime. ISO 8601 format.' }),
