  // --- Model-enriched structural data ---
  (dm_uika42uwtj3ijdbegzw2kcwq:DataModel { id: 'dm-uika42uwtj3ijdbegzw2kcwq', label: 'Civil Registry', sdcType: 'DataModel', description: 'Maintain the authoritative identity record for every person in Cordova.', dcSubject: 'Civil Registry', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_aan7382wp8e2f58m9a2hvmkp:Cluster:SDC4Component { id: 'mc-aan7382wp8e2f58m9a2hvmkp', label: 'Civil Registry Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed civil-registry record in CordovaOS: a person\'s civil-status events such as births, marriages, and deaths. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_bgjt4mvgvkxcn6hurg37u21b:Cluster:SDC4Component { id: 'mc-bgjt4mvgvkxcn6hurg37u21b', label: 'Civil Registry Record', sdcType: 'Cluster', description: 'A complete civil registry entry for one person. This is the anchor node in the Cordova graph — the Person cell that every other domain references.\nBusiness Context: Authoritative source of truth for all government identity verification\nPurpose: Complete identity record for a Cordova resident' }),
  (comp_nj7s1gk45tfgyooxpz0qaha3:XdString:SDC4Component { id: 'mc-nj7s1gk45tfgyooxpz0qaha3', label: 'National ID (CID)', sdcType: 'XdString', seq: '0000', description: 'Cordova National Identity Number. Format: COR-PPCC-NNNNNN where PP is the two-letter province code (AL=Aldara, BR=Brevina, CE=Celara), CC is the two-digit city code (01-03), and NNNNNN is a six-digit sequence number. Issued at birth or naturalization. Required for all government transactions.', exactLength: '16', pattern: 'COR-(AL|BR|CE)0[1-3]-[0-9]{6}' }),
  (comp_cfg2l8ym4ve833ritrxu765t:XdString:SDC4Component { id: 'mc-cfg2l8ym4ve833ritrxu765t', label: 'Country of Birth', sdcType: 'XdString', seq: '0000', description: 'Country where participant was born', minLength: '1', maxLength: '200' }),
  (comp_kfyzf8u8gdafcpt5kfh2qg3q:XdString:SDC4Component { id: 'mc-kfyzf8u8gdafcpt5kfh2qg3q', label: 'Given Name (Person)', sdcType: 'XdString', seq: '0000', description: 'name typically used to differentiate people from the same family, clan, or other social group who have a common last name\naka. first name or forename', minLength: '1', maxLength: '100' }),
  (comp_oit0ueglhjfcyq80z22kl2z3:XdString:SDC4Component { id: 'mc-oit0ueglhjfcyq80z22kl2z3', label: 'Middle Name (Person)', sdcType: 'XdString', seq: '0000', description: 'Middle or other name(s) given to identify a person', minLength: '1', maxLength: '100' }),
  (comp_v8jgjo2sml12jo7zrb8swoxi:XdString:SDC4Component { id: 'mc-v8jgjo2sml12jo7zrb8swoxi', label: 'Surname (Person)', sdcType: 'XdString', seq: '0000', description: 'The surname or family name of a person, part of a naming scheme for individuals, used in many cultures worldwide\r\naka: last name, fam name, family surname, surname, clan name', minLength: '1', maxLength: '100' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_vjfgimlbb90ds2xg55tfn941:XdToken:SDC4Component { id: 'mc-vjfgimlbb90ds2xg55tfn941', label: 'Marital Status (Cordova)', sdcType: 'XdToken', seq: '0000', description: 'Marital status as recorded in the Cordova Civil Registry. Aligned with vital statistics records.', enumerations: 'Single; Married; Divorced; Widowed; Separated' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
  (comp_cymq16em5zb20whgtfzki6n5:XdToken:SDC4Component { id: 'mc-cymq16em5zb20whgtfzki6n5', label: 'Gender Identity', sdcType: 'XdToken', seq: '0000', description: 'Self-reported gender identity of the participant', enumerations: 'Male; Female; Transgender male; Transgender female; Non-binary; Genderqueer; Other; Prefer not to answer; Unknown' }),
  (comp_mw9qdn71urog8egjbp5t3y00:XdToken:SDC4Component { id: 'mc-mw9qdn71urog8egjbp5t3y00', label: 'Sex', sdcType: 'XdToken', seq: '0000', description: 'Biological sex assigned at birth based on physical characteristics. UMLS CUI: C0079399 (Biologic Sex). Aligned with OMB standards for reporting.', enumerations: 'Male; Female; Intersex; Unknown' }),
  (comp_g3k6bj8su3rvkszg2700dhyh:XdTemporal:SDC4Component { id: 'mc-g3k6bj8su3rvkszg2700dhyh', label: 'Birth Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date of birth of the participant. UMLS CUI: C0421451 (Date of birth). LOINC: 21112-8 (Birth date).' }),
  (cluster_sv48g8am8vqs46nodiugripz:Cluster:SDC4Component { id: 'mc-sv48g8am8vqs46nodiugripz', label: 'Contact Information', sdcType: 'Cluster', description: 'Phone, email, and preferred contact method for the person.\nPurpose: Enable government communication with the person\nParent Cluster: Civil Registry Record' }),
