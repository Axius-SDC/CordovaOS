  // --- Model-enriched structural data ---
  (dm_x44vt69qqri2bl7vwxb8ck7n:DataModel { id: 'dm-x44vt69qqri2bl7vwxb8ck7n', label: 'Property Registry', sdcType: 'DataModel', description: 'Maintain the authoritative registry of land and property ownership in Cordova.', dcSubject: 'Property Record', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_jyx3v449tku745yxm6hte0eg:Cluster:SDC4Component { id: 'mc-jyx3v449tku745yxm6hte0eg', label: 'Property Registry Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed property-registry record in CordovaOS: a parcel\'s title, ownership, and transfers. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_bgc4n3424bzb8gpgnjhxxha9:Cluster:SDC4Component { id: 'mc-bgc4n3424bzb8gpgnjhxxha9', label: 'Property Record', sdcType: 'Cluster', description: 'A registered land parcel or property in Cordova.\nBusiness Context: Links to Civil Registry (person owners) and Business Registry (business owners)\nPurpose: Document a property with location, type, and current ownership' }),
  (comp_hs7197k4s33eg7wbspgudu4u:XdString:SDC4Component { id: 'mc-hs7197k4s33eg7wbspgudu4u', label: 'Parcel Number', sdcType: 'XdString', seq: '0000', description: 'Cordova property parcel identifier. Format: PP-CC-NNNNNN where PP is the province code, CC is the city code, and NNNNNN is a parcel sequence number.', exactLength: '12', pattern: '(AL|BR|CE)-0[1-3]-[0-9]{6}' }),
  (comp_l338k7nlvnq2am0owa19yxfc:XdString:SDC4Component { id: 'mc-l338k7nlvnq2am0owa19yxfc', label: 'Address (Line 1)', sdcType: 'XdString', seq: '0000', description: 'Street address line, building/apartment number, or P.O. Box number.', maxLength: '200' }),
  (comp_ek5h6dsqpd9kz0l4mcckmxpt:XdString:SDC4Component { id: 'mc-ek5h6dsqpd9kz0l4mcckmxpt', label: 'Address (Line 2)', sdcType: 'XdString', seq: '0000', description: 'Street address line, building/apartment number, or P.O. Box number.', maxLength: '200' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_xtljf8q6rfyfewdkgu4e5ouj:XdToken:SDC4Component { id: 'mc-xtljf8q6rfyfewdkgu4e5ouj', label: 'Property Status', sdcType: 'XdToken', seq: '0000', description: 'Current status of the property in the registry', enumerations: 'Active; Encumbered; In Transfer; Government Seized; Abandoned' }),
  (comp_l79ua955rihnjbrxyhu7z5ac:XdToken:SDC4Component { id: 'mc-l79ua955rihnjbrxyhu7z5ac', label: 'Property Type (Cordova)', sdcType: 'XdToken', seq: '0000', description: 'Classification of real property in the Cordova Property Registry.', enumerations: 'Residential; Commercial; Agricultural; Government; Industrial' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
  (comp_vo9jtmexkaaol3y657fm0xn8:XdTemporal:SDC4Component { id: 'mc-vo9jtmexkaaol3y657fm0xn8', label: 'Registration Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the business was officially registered in Cordova' }),
  (cluster_tjkw46wy20kstzgg1y60clxx:Cluster:SDC4Component { id: 'mc-tjkw46wy20kstzgg1y60clxx', label: 'Liens and Encumbrances', sdcType: 'Cluster', description: 'Outstanding liens, mortgages, or legal encumbrances on the property.\nPurpose: Record financial and legal claims against the property\nParent Cluster: Property Record' }),
  (comp_kzalko16uuwdw74yohvr5t50:XdToken:SDC4Component { id: 'mc-kzalko16uuwdw74yohvr5t50', label: 'Lien Status', sdcType: 'XdToken', seq: '0000', description: 'Current status of the lien', enumerations: 'Active; Satisfied; Released' }),
  (comp_cy92p3uebrmjf191wcs07t3o:XdToken:SDC4Component { id: 'mc-cy92p3uebrmjf191wcs07t3o', label: 'Lien Type', sdcType: 'XdToken', seq: '0000', description: 'Type of lien or encumbrance', enumerations: 'Mortgage; Tax Lien; Judgment Lien; Mechanic\'s Lien; Easement' }),
  (comp_da261k0tox4747gnkmmek15i:XdQuantity:SDC4Component { id: 'mc-da261k0tox4747gnkmmek15i', label: 'Lien Amount', sdcType: 'XdQuantity', seq: '0000', description: 'Monetary value of the lien or encumbrance recorded against the property in Cordova Córdoba. Represents the outstanding obligation secured by the property.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '14', fractionDigits: '2' }),
  (comp_u18l77xlj2omcbmnpi5j7fff:Units:SDC4Component { id: 'mc-u18l77xlj2omcbmnpi5j7fff', label: 'Cordova Córdoba (COR)', sdcType: 'Units' }),
  (comp_zicto01f2grmzuqtgdonv83w:XdTemporal:SDC4Component { id: 'mc-zicto01f2grmzuqtgdonv83w', label: 'Lien Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the lien was recorded' }),
  (cluster_cexrgb7uy29kn6w27tpmujtv:Cluster:SDC4Component { id: 'mc-cexrgb7uy29kn6w27tpmujtv', label: 'Property Value Assessment', sdcType: 'Cluster', description: 'Property value assessment for tax purposes.\nPurpose: Record assessed values that link to Tax & Revenue for property tax filings\nParent Cluster: Property Record' }),
  (comp_j3y76yob1s958dry2d551tew:XdToken:SDC4Component { id: 'mc-j3y76yob1s958dry2d551tew', label: 'Assessment Status', sdcType: 'XdToken', seq: '0000', description: 'Status of the assessment', enumerations: 'Final; Under Appeal; Preliminary' }),
  (comp_hlg1jmx1v9t4zkq16c1i66bg:XdQuantity:SDC4Component { id: 'mc-hlg1jmx1v9t4zkq16c1i66bg', label: 'Assessed Value', sdcType: 'XdQuantity', seq: '0000', description: 'Government-determined market value of the property in Cordova Córdoba. Used as the basis for property tax calculation by the Cordova Tax Authority.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '14', fractionDigits: '2' }),
  (comp_rbq2sjcb8h284c8dnzjdna5h:XdQuantity:SDC4Component { id: 'mc-rbq2sjcb8h284c8dnzjdna5h', label: 'Land Area', sdcType: 'XdQuantity', seq: '0000', description: 'Total area of the land parcel in square meters as recorded in the cadastral survey. Used for property assessment, zoning compliance, and land use planning.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '10', fractionDigits: '2' }),
  (comp_f53n973eb8d9qrnnp9atw8eu:Units:SDC4Component { id: 'mc-f53n973eb8d9qrnnp9atw8eu', label: 'Square Meters', sdcType: 'Units' }),
