  (comp_og08xf6bu928uuz6t3y0e23f:XdString:SDC4Component { id: 'mc-og08xf6bu928uuz6t3y0e23f', label: 'Acted On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The agent on whose behalf this agent acted (prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
