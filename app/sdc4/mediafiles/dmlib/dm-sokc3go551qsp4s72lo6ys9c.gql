  (comp_wl6j4ekcmu4hvt2m12zw4zp8:XdToken:SDC4Component { id: 'mc-wl6j4ekcmu4hvt2m12zw4zp8', label: 'Activity Status', sdcType: 'XdToken', seq: '0000', description: 'The state of an activity, from the Data Privacy Vocabulary activity status concepts.', enumerations: 'ActivityProposed; ActivityPlanned; ActivityOngoing; ActivityHalted; ActivityCompleted; ActivityNotCompleted' }),
