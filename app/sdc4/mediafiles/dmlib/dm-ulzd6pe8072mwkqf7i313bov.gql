  (dm_ulzd6pe8072mwkqf7i313bov:DataModel { id: 'dm-ulzd6pe8072mwkqf7i313bov', label: 'Vital Statistics Record', sdcType: 'DataModel', description: 'Maintain the authoritative registry of life events in Cordova.', dcSubject: 'Vital Statistics', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_r2g662g70dx34eq12v9n4ng7:Cluster:SDC4Component { id: 'mc-r2g662g70dx34eq12v9n4ng7', label: 'Vital Statistics Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed vital-statistics record in CordovaOS: vital events compiled for statistical use. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_hdhjfg00tngir2txgqyka9cv:Cluster:SDC4Component { id: 'mc-hdhjfg00tngir2txgqyka9cv', label: 'Provenance Components', sdcType: 'Cluster', description: 'Cluster for Provenance Components' }),
  (comp_m9xg6e182m1oq77ssrf9iujv:XdString:SDC4Component { id: 'mc-m9xg6e182m1oq77ssrf9iujv', label: 'activity_description', sdcType: 'XdString', seq: '0000', description: 'Detailed description of what this activity does and its purpose.', minLength: '1', maxLength: '2000' }),
  (comp_ccj1yq2wtwknobszkgzzdbtr:XdString:SDC4Component { id: 'mc-ccj1yq2wtwknobszkgzzdbtr', label: 'prov_activity_type', sdcType: 'XdString', seq: '0000', description: 'Type of activity from the W3C Activity Streams 2.0 vocabulary. Describes what was done to the data.', minLength: '1', maxLength: '200' }),
  (comp_bd3s8t23d6m3zizmpwavc32y:XdString:SDC4Component { id: 'mc-bd3s8t23d6m3zizmpwavc32y', label: 'system_identifier', sdcType: 'XdString', seq: '0000', description: 'Identifier of the system that handled the data. Maps to prov:Entity context in the PROV-O export. This is the AuditType.system-id field.', minLength: '1', maxLength: '50' }),
  (comp_zr59goe24qkocprl3feul3mt:XdString:SDC4Component { id: 'mc-zr59goe24qkocprl3feul3mt', label: 'system_location_identifier', sdcType: 'XdString', seq: '0000', description: 'Code or identifier for the system location. Used for cross-system location resolution.', minLength: '1', maxLength: '50' }),
  (comp_fnodzqkbyskwe7nh58rs336k:XdString:SDC4Component { id: 'mc-fnodzqkbyskwe7nh58rs336k', label: 'system_location_name', sdcType: 'XdString', seq: '0000', description: 'Name of the physical or logical location where the system resides. Maps to prov:atLocation.', minLength: '1', maxLength: '100' }),
  (comp_edvvjznmaoibzmfna0uuoo37:XdTemporal:SDC4Component { id: 'mc-edvvjznmaoibzmfna0uuoo37', label: 'activity_timestamp_end', sdcType: 'XdTemporal', seq: '0000', description: 'When the provenance activity completed. Maps to prov:endedAtTime. ISO 8601 format.' }),
  (comp_o72s5793973fzho35rnaughs:XdTemporal:SDC4Component { id: 'mc-o72s5793973fzho35rnaughs', label: 'activity_timestamp_start', sdcType: 'XdTemporal', seq: '0000', description: 'When the provenance activity began. Maps to prov:startedAtTime. ISO 8601 format.' }),
  (cluster_tard9hhq13m95hinbh4h7k5j:Cluster:SDC4Component { id: 'mc-tard9hhq13m95hinbh4h7k5j', label: 'Vital Event', sdcType: 'Cluster', description: 'A single life event recorded in the Cordova vital statistics registry.\nBusiness Context: Links to Civil Registry for person identification\nPurpose: Common fields shared across all vital event types', asserts: 'not(ti1efft41nnipki8xxa66rx5/xdtemporal-date and b69biqbujb16w4a624hizmyh/xdtemporal-date) or ti1efft41nnipki8xxa66rx5/xdtemporal-date le b69biqbujb16w4a624hizmyh/xdtemporal-date' }),
  (comp_ajfsyoyrz38094hswxh13i3x:XdString:SDC4Component { id: 'mc-ajfsyoyrz38094hswxh13i3x', label: 'Certificate Number', sdcType: 'XdString', seq: '0000', description: 'Unique certificate number for this vital record', minLength: '1', maxLength: '50' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_jz7vc6ikueqig8g0lvb2czzr:XdToken:SDC4Component { id: 'mc-jz7vc6ikueqig8g0lvb2czzr', label: 'Event Type', sdcType: 'XdToken', seq: '0000', description: 'Type of vital event (XdToken)', enumerations: 'Birth; Death; Marriage; Divorce' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
  (comp_yri6g628ipi0jqoa0ijnzxxu:XdToken:SDC4Component { id: 'mc-yri6g628ipi0jqoa0ijnzxxu', label: 'Record Status', sdcType: 'XdToken', seq: '0000', description: 'Status of the vital record', enumerations: 'Active; Amended; Voided' }),
  (comp_e3sfb43zh1vjlgceb5guh0mj:XdTemporal:SDC4Component { id: 'mc-e3sfb43zh1vjlgceb5guh0mj', label: 'Event Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the vital event occurred' }),
  (comp_vo9jtmexkaaol3y657fm0xn8:XdTemporal:SDC4Component { id: 'mc-vo9jtmexkaaol3y657fm0xn8', label: 'Registration Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the business was officially registered in Cordova' }),
  (cluster_az8kem3v58y9zenys7mthqxe:Cluster:SDC4Component { id: 'mc-az8kem3v58y9zenys7mthqxe', label: 'Birth Record', sdcType: 'Cluster', description: 'Details specific to birth certificates.\nBusiness Context: Links newborn and parents to Civil Registry, physician to Healthcare\nPurpose: Document a birth with parents, attending physician, and location\nParent Cluster: Vital Event' }),
  (comp_nj7s1gk45tfgyooxpz0qaha3:XdString:SDC4Component { id: 'mc-nj7s1gk45tfgyooxpz0qaha3', label: 'National ID (CID)', sdcType: 'XdString', seq: '0000', description: 'Cordova National Identity Number. Format: COR-PPCC-NNNNNN where PP is the two-letter province code (AL=Aldara, BR=Brevina, CE=Celara), CC is the two-digit city code (01-03), and NNNNNN is a six-digit sequence number. Issued at birth or naturalization. Required for all government transactions.', exactLength: '16', pattern: 'COR-(AL|BR|CE)0[1-3]-[0-9]{6}' }),
  (comp_pmw2cq7fioqlbs2ljdh34rkn:XdString:SDC4Component { id: 'mc-pmw2cq7fioqlbs2ljdh34rkn', label: 'Person Full Name', sdcType: 'XdString', seq: '0000', description: 'A complete name of a person (NIEM nc:PersonFullName)', minLength: '1', maxLength: '100' }),
  (comp_mw9qdn71urog8egjbp5t3y00:XdToken:SDC4Component { id: 'mc-mw9qdn71urog8egjbp5t3y00', label: 'Sex', sdcType: 'XdToken', seq: '0000', description: 'Biological sex assigned at birth based on physical characteristics. UMLS CUI: C0079399 (Biologic Sex). Aligned with OMB standards for reporting.', enumerations: 'Male; Female; Intersex; Unknown' }),
  (cluster_tdz3pxrf7k6z2df2bfm7ebcp:Cluster:SDC4Component { id: 'mc-tdz3pxrf7k6z2df2bfm7ebcp', label: 'Death Record', sdcType: 'Cluster', description: 'Details specific to death certificates.\nBusiness Context: Links to Healthcare (certifying physician), enables public health statistics\nPurpose: Document a death with cause, certifying physician, and circumstances\nParent Cluster: Vital Event' }),
  (comp_m3gsphdej7z9csemrrk8uymy:XdString:SDC4Component { id: 'mc-m3gsphdej7z9csemrrk8uymy', label: 'Cause of Death', sdcType: 'XdString', seq: '0000', description: 'Primary cause of death as determined by certifying physician', minLength: '1', maxLength: '200' }),
  (comp_ftuxt5nrrffwjb2vymn80yx2:XdToken:SDC4Component { id: 'mc-ftuxt5nrrffwjb2vymn80yx2', label: 'Manner of Death', sdcType: 'XdToken', seq: '0000', description: 'Manner in which death occurred', enumerations: 'Natural; Accident; Homicide; Suicide; Undetermined; Pending Investigation' }),
  (comp_dsoyfaplxw8ide1opo5w8fxg:XdToken:SDC4Component { id: 'mc-dsoyfaplxw8ide1opo5w8fxg', label: 'Place of Death', sdcType: 'XdToken', seq: '0000', description: 'Type of location where death occurred', enumerations: 'Hospital; Residence; Other' }),
  (cluster_obybok0oaoa79b11b0ync1zf:Cluster:SDC4Component { id: 'mc-obybok0oaoa79b11b0ync1zf', label: 'Divorce Record', sdcType: 'Cluster', description: 'Details specific to divorce decrees.\nPurpose: Document a divorce with both parties and court details\nParent Cluster: Vital Event' }),
  (comp_ycujkecjszwwrcd6dhxesk73:XdString:SDC4Component { id: 'mc-ycujkecjszwwrcd6dhxesk73', label: 'Marriage Certificate Number', sdcType: 'XdString', seq: '0000', description: 'Certificate number of the original marriage being dissolved', minLength: '1', maxLength: '50' }),
  (comp_ft4kk6m3r1goxkte0d7wflk8:XdTemporal:SDC4Component { id: 'mc-ft4kk6m3r1goxkte0d7wflk8', label: 'Decree Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the divorce decree was issued by the court' }),
  (cluster_chtyne5i6qcwbrby29vbuh2k:Cluster:SDC4Component { id: 'mc-chtyne5i6qcwbrby29vbuh2k', label: 'Marriage Record', sdcType: 'Cluster', description: 'Details specific to marriage certificates.\nBusiness Context: Links both parties to Civil Registry identities\nPurpose: Document a marriage with both parties, officiant, and witnesses\nParent Cluster: Vital Event' }),
