  (dm_pm5cks82lnrvyna1xbwpfxic:DataModel { id: 'dm-pm5cks82lnrvyna1xbwpfxic', label: 'Employment Record', sdcType: 'DataModel', description: 'Track employment relationships between persons and businesses in Cordova.', dcSubject: 'Employment Registry', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_xdu3vqk4vhuko5mghl4y4xxk:Cluster:SDC4Component { id: 'mc-xdu3vqk4vhuko5mghl4y4xxk', label: 'Employment Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed employment record in CordovaOS: an individual\'s employment and personnel history. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_ablvqv20fp33v8t8c985dlo2:Cluster:SDC4Component { id: 'mc-ablvqv20fp33v8t8c985dlo2', label: 'Employment Record', sdcType: 'Cluster', description: 'A single employment relationship between a person and an employer.\nBusiness Context: Links Civil Registry persons to Business Registry entities\nPurpose: Document an employment position with dates, role, and compensation', asserts: 'not(z4fn8x96jfshcqr00yn4l03u/xdtemporal-date) or v0yx6hs60te4k7xlzbpy30x3/xdtemporal-date le z4fn8x96jfshcqr00yn4l03u/xdtemporal-date' }),
  (comp_bbu03oqjkniydmzb7pqcjg3m:XdString:SDC4Component { id: 'mc-bbu03oqjkniydmzb7pqcjg3m', label: 'Department', sdcType: 'XdString', seq: '0000', description: 'Department or division within the employer organization', minLength: '1', maxLength: '200' }),
  (comp_wfws1oj1kgeaijciw7wkzdi7:XdString:SDC4Component { id: 'mc-wfws1oj1kgeaijciw7wkzdi7', label: 'Job Title', sdcType: 'XdString', seq: '0000', description: 'Current job title or occupation', minLength: '1', maxLength: '200' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_tb3wwfwects1a6ap4ro7z5s8:XdToken:SDC4Component { id: 'mc-tb3wwfwects1a6ap4ro7z5s8', label: 'Employment Status (Cordova)', sdcType: 'XdToken', seq: '0000', description: 'Employment classification in Cordova employment records.', enumerations: 'Full-Time; Part-Time; Contract; Self-Employed; Unemployed; Retired; Student' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
