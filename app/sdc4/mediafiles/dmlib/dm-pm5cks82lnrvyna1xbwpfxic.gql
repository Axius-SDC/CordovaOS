  (cluster_vzabxfc733qk7lo1knaggxfs:Cluster:SDC4Component { id: 'mc-vzabxfc733qk7lo1knaggxfs', label: 'Compensation', sdcType: 'Cluster', description: 'Salary and benefits information. Restricted to Tax Authority and Employer/HR roles.\nPurpose: Record compensation for tax reporting and labor statistics\nParent Cluster: Employment Record' }),
