  // --- Model-enriched structural data ---
  (dm_yh0opq0bnu6y9y56oukg92uf:DataModel { id: 'dm-yh0opq0bnu6y9y56oukg92uf', label: 'Law Enforcement Record', sdcType: 'DataModel', description: 'Record public safety incidents, charges, and dispositions in Cordova.', dcSubject: 'Law Enforcement', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_kcam9lm7091vqtvb253ixjxr:Cluster:SDC4Component { id: 'mc-kcam9lm7091vqtvb253ixjxr', label: 'Law Enforcement Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed law-enforcement record in CordovaOS: an incident, its investigation, and its chain of custody. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_songhwxr1fp8niqba4fd0yd9:Cluster:SDC4Component { id: 'mc-songhwxr1fp8niqba4fd0yd9', label: 'Incident Report', sdcType: 'Cluster', description: 'A single public safety incident recorded by Cordova National Police.\nBusiness Context: Links to Civil Registry for person identification\nPurpose: Document an incident with location, category, involved parties, and outcome' }),
  (comp_yi2189u4pinqitlmm5t6ccrd:XdString:SDC4Component { id: 'mc-yi2189u4pinqitlmm5t6ccrd', label: 'Incident Report Number', sdcType: 'XdString', seq: '0000', description: 'A report number for an incident (NIEM j:IncidentReportNumber)', minLength: '1', maxLength: '50' }),
  (comp_rguhpkd7s2d9a51392aon7ir:XdString:SDC4Component { id: 'mc-rguhpkd7s2d9a51392aon7ir', label: 'Incident Summary', sdcType: 'XdString', seq: '0000', description: 'Brief summary of incident (one paragraph)', minLength: '1', maxLength: '2000' }),
  (comp_b6nahtg2we4rh5qsk2j7qfvz:XdString:SDC4Component { id: 'mc-b6nahtg2we4rh5qsk2j7qfvz', label: 'Location Street Full Text', sdcType: 'XdString', seq: '0000', description: 'A complete street address (NIEM nc:LocationStreetFullText). BFO alignment: address is an information content entity (IAO:0000030) referring to a site (BFO:0000029).', minLength: '1', maxLength: '200' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_e83h36jqgi59dhy1dttp22qm:XdToken:SDC4Component { id: 'mc-e83h36jqgi59dhy1dttp22qm', label: 'Incident Status', sdcType: 'XdToken', seq: '0000', description: 'Current status of the incident', enumerations: 'Open; Closed; Pending' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
  (comp_nc7aq6ofnccavkmczsb2dudy:XdToken:SDC4Component { id: 'mc-nc7aq6ofnccavkmczsb2dudy', label: 'Incident Category Code', sdcType: 'XdToken', seq: '0000', description: 'Categories of incidents per NIEM j:IncidentCategoryCode', enumerations: 'accident; assault; burglary; robbery; theft; vandalism; fraud; drug_offense; dui; domestic_violence; harassment; missing_person; suspicious_activity; traffic; fire; medical; other' }),
  (comp_ohk2uwcomsz8wegfvz0v0yod:XdTemporal:SDC4Component { id: 'mc-ohk2uwcomsz8wegfvz0v0yod', label: 'Incident Date', sdcType: 'XdTemporal', seq: '0000', description: 'A date and time an incident occurred (NIEM j:IncidentDate). BFO alignment: incident is a process (BFO:0000015) occurring at a temporal region.' }),
  (cluster_c3eoo0vfid9c8riruf7uoyz2:Cluster:SDC4Component { id: 'mc-c3eoo0vfid9c8riruf7uoyz2', label: 'Charge and Disposition', sdcType: 'Cluster', description: 'Charges filed and case outcome. Cordova has misdemeanor-level offenses only.\nPurpose: Record charges and their disposition\nParent Cluster: Incident Report', asserts: 'not(slbi4r6w1k42qtswbsowzhz6/xdtoken-value = \'Fine\') or boolean(y8yx9mjnek5l2kmfo3h7re3i)' }),
  (comp_eoqim4xj9gsxtxrqko1hh55o:XdString:SDC4Component { id: 'mc-eoqim4xj9gsxtxrqko1hh55o', label: 'Charge Description', sdcType: 'XdString', seq: '0000', description: 'A description of a charge (NIEM j:ChargeDescriptionText)', minLength: '1', maxLength: '200' }),
  (comp_hc91pdnj3bb6997l5z4ndchz:XdToken:SDC4Component { id: 'mc-hc91pdnj3bb6997l5z4ndchz', label: 'Charge Category (Cordova)', sdcType: 'XdToken', seq: '0000', description: 'Categories of misdemeanor offenses in Cordova law enforcement records. Cordova has no felony classification — all criminal matters are misdemeanor-level.', enumerations: 'Petty Theft; Public Intoxication; Trespassing; Disorderly Conduct; Traffic Violation; Minor Vandalism' }),
  (comp_rnje7nq6m08vh01g8eg23say:XdToken:SDC4Component { id: 'mc-rnje7nq6m08vh01g8eg23say', label: 'Disposition (Cordova)', sdcType: 'XdToken', seq: '0000', description: 'Outcome of a law enforcement case in Cordova.', enumerations: 'Fine; Community Service; Case Dismissed; Pending' }),
  (comp_yahksk4xc5to981ows7bpp6z:XdQuantity:SDC4Component { id: 'mc-yahksk4xc5to981ows7bpp6z', label: 'Fine or Bail Amount', sdcType: 'XdQuantity', seq: '0000', description: 'Monetary amount of the fine imposed or bail set for the charge in Cordova Córdoba. Null if no financial penalty applies or bail is denied.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '12', fractionDigits: '2' }),
  (comp_u18l77xlj2omcbmnpi5j7fff:Units:SDC4Component { id: 'mc-u18l77xlj2omcbmnpi5j7fff', label: 'Cordova Córdoba (COR)', sdcType: 'Units' }),
  (comp_qse1jwofk5lm2wnsrn3f06l0:XdTemporal:SDC4Component { id: 'mc-qse1jwofk5lm2wnsrn3f06l0', label: 'Disposition Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the disposition was recorded\n\n---' }),
  (comp_l0esdclu01pg7qw429oe7kjk:XdTemporal:SDC4Component { id: 'mc-l0esdclu01pg7qw429oe7kjk', label: 'Charge Filing Date', sdcType: 'XdTemporal', seq: '0000', description: 'A date a charge was filed (NIEM j:ChargeFilingDate)' }),
  (cluster_avmmc3r38dol0ghko42yeyp4:Cluster:SDC4Component { id: 'mc-avmmc3r38dol0ghko42yeyp4', label: 'Quarantine Enforcement', sdcType: 'Cluster', description: 'Special sub-cluster for public health quarantine orders. Used in the Contagion scenario.\nBusiness Context: Links Law Enforcement to Healthcare domain through quarantine orders\nPurpose: Document quarantine zone establishment and compliance monitoring\nParent Cluster: Incident Report', asserts: 'not(w33a4q5hoiqnex7t3dv5v43v/xdtemporal-date) or hcsadpovanyp7x6p8wwnw6k6/xdtemporal-date le w33a4q5hoiqnex7t3dv5v43v/xdtemporal-date' }),
  (comp_ixmedhicidzpi7g6g2huqzvv:XdString:SDC4Component { id: 'mc-ixmedhicidzpi7g6g2huqzvv', label: 'Issuing Authority', sdcType: 'XdString', seq: '0000', description: 'The authority that issued the quarantine order (e.g., "Provincial Health Authority, Aldara")', minLength: '1', maxLength: '200' }),
