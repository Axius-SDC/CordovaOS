  // --- Model-enriched structural data ---
  (dm_goc13fg5a97ghcqv64h782af:DataModel { id: 'dm-goc13fg5a97ghcqv64h782af', label: 'Property Registry 4.4.0', sdcType: 'DataModel', description: 'Maintain the authoritative registry of land and property ownership in Cordova.', dcSubject: 'Property Record', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_a79m06519b9qglqbhaulto7h:Cluster:SDC4Component { id: 'mc-a79m06519b9qglqbhaulto7h', label: 'Property Registry Governed Record', sdcType: 'Cluster', description: 'A property registry record. The governed record: the data cluster, the PROV activity and agent and the audit event from the ProvGov library by identifier, and the digital signature proof. Members: Property Record; prov-activity (Provgov); prov-agent (Provgov); audit-event (Provgov); Digital Signature Proof.' }),
  (comp_gug5dhtqfv7exbgmm2raxpkq:XdFile:SDC4Component { id: 'mc-gug5dhtqfv7exbgmm2raxpkq', label: 'Digital Signature Proof', sdcType: 'XdFile', seq: '0000', description: 'Cryptographic proof of attestation (digital signature)' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
  (comp_dkc2ccj5te35z9gd4bu1blcq:XdString:SDC4Component { id: 'mc-dkc2ccj5te35z9gd4bu1blcq', label: 'Audit Agent Reference', sdcType: 'XdString', seq: '0000', description: 'The acting agent (FHIR AuditEvent.agent.who). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_gcjyjrnp0wsfoelcp4m05c67:XdString:SDC4Component { id: 'mc-gcjyjrnp0wsfoelcp4m05c67', label: 'Audit Entity Reference', sdcType: 'XdString', seq: '0000', description: 'The entity the event concerns (FHIR AuditEvent.entity.what). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_l9bhdtigs94bwmsu3t1n9xp1:Cluster:SDC4Component { id: 'mc-l9bhdtigs94bwmsu3t1n9xp1', label: 'Property Record', sdcType: 'Cluster', description: 'A registered property: parcel number, the NIEM location (Default geolocation and address by identifier) with the Cordova city and province, property type and status, registration date, the owner\'s national ID, liens, assessment and transfers. Members: Parcel Number; location (NIEM); City; Province; Property Type (Cordova); Property Status; Registration Date; National ID (CID); Lien; Property Value Assessment; Property Transfer.' }),
  (comp_nj7s1gk45tfgyooxpz0qaha3:XdString:SDC4Component { id: 'mc-nj7s1gk45tfgyooxpz0qaha3', label: 'National ID (CID)', sdcType: 'XdString', seq: '0000', description: 'Cordova National Identity Number. Format: COR-PPCC-NNNNNN where PP is the two-letter province code (AL=Aldara, BR=Brevina, CE=Celara), CC is the two-digit city code (01-03), and NNNNNN is a six-digit sequence number. Issued at birth or naturalization. Required for all government transactions.', exactLength: '16', pattern: 'COR-(AL|BR|CE)0[1-3]-[0-9]{6}' }),
  (comp_hs7197k4s33eg7wbspgudu4u:XdString:SDC4Component { id: 'mc-hs7197k4s33eg7wbspgudu4u', label: 'Parcel Number', sdcType: 'XdString', seq: '0000', description: 'Cordova property parcel identifier. Format: PP-CC-NNNNNN where PP is the province code, CC is the city code, and NNNNNN is a parcel sequence number.', exactLength: '12', pattern: '(AL|BR|CE)-0[1-3]-[0-9]{6}' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_xtljf8q6rfyfewdkgu4e5ouj:XdToken:SDC4Component { id: 'mc-xtljf8q6rfyfewdkgu4e5ouj', label: 'Property Status', sdcType: 'XdToken', seq: '0000', description: 'Current status of the property in the registry', enumerations: 'Active; Encumbered; In Transfer; Government Seized; Abandoned' }),
  (comp_l79ua955rihnjbrxyhu7z5ac:XdToken:SDC4Component { id: 'mc-l79ua955rihnjbrxyhu7z5ac', label: 'Property Type (Cordova)', sdcType: 'XdToken', seq: '0000', description: 'Classification of real property in the Cordova Property Registry.', enumerations: 'Residential; Commercial; Agricultural; Government; Industrial' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
  (comp_vo9jtmexkaaol3y657fm0xn8:XdTemporal:SDC4Component { id: 'mc-vo9jtmexkaaol3y657fm0xn8', label: 'Registration Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the business was officially registered in Cordova' }),
  (cluster_kamsjtflanpnhfffiexw366w:Cluster:SDC4Component { id: 'mc-kamsjtflanpnhfffiexw366w', label: 'Lien', sdcType: 'Cluster', description: 'A lien or encumbrance on a property: type, status, amount in Córdobas, date and holder. Members: Lien Type; Lien Status; Lien Amount; Lien Date; Lien Holder.' }),
  (comp_in6swdxnzwkj4rv1lpdgo9s8:XdString:SDC4Component { id: 'mc-in6swdxnzwkj4rv1lpdgo9s8', label: 'Lien Holder', sdcType: 'XdString', seq: '0000', description: 'Name of the entity holding the lien', minLength: '1', maxLength: '100' }),
  (comp_kzalko16uuwdw74yohvr5t50:XdToken:SDC4Component { id: 'mc-kzalko16uuwdw74yohvr5t50', label: 'Lien Status', sdcType: 'XdToken', seq: '0000', description: 'Current status of the lien', enumerations: 'Active; Satisfied; Released' }),
  (comp_cy92p3uebrmjf191wcs07t3o:XdToken:SDC4Component { id: 'mc-cy92p3uebrmjf191wcs07t3o', label: 'Lien Type', sdcType: 'XdToken', seq: '0000', description: 'Type of lien or encumbrance', enumerations: 'Mortgage; Tax Lien; Judgment Lien; Mechanic\'s Lien; Easement' }),
  (comp_da261k0tox4747gnkmmek15i:XdQuantity:SDC4Component { id: 'mc-da261k0tox4747gnkmmek15i', label: 'Lien Amount', sdcType: 'XdQuantity', seq: '0000', description: 'Monetary value of the lien or encumbrance recorded against the property in Cordova Córdoba. Represents the outstanding obligation secured by the property.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '14', fractionDigits: '2' }),
  (comp_u18l77xlj2omcbmnpi5j7fff:Units:SDC4Component { id: 'mc-u18l77xlj2omcbmnpi5j7fff', label: 'Cordova Córdoba (COR)', sdcType: 'Units' }),
  (comp_zicto01f2grmzuqtgdonv83w:XdTemporal:SDC4Component { id: 'mc-zicto01f2grmzuqtgdonv83w', label: 'Lien Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the lien was recorded' }),
  (cluster_o01gifxohfe46jfdyh62noig:Cluster:SDC4Component { id: 'mc-o01gifxohfe46jfdyh62noig', label: 'Location (NIEM)', sdcType: 'Cluster', description: 'A data type for geospatial location. NIEM 6.0 nc:LocationType. Members: geolocation (Default); Address (NIEM); Location Name; Location Description; Location Category; Location Directions; Location Identification; Location Altitude; Location Elevation; Location Landmark Name; Location Range Description; Location Surrounding Area Description; Locale.' }),
  (comp_fenldej2l73b84w956gawyqd:XdString:SDC4Component { id: 'mc-fenldej2l73b84w956gawyqd', label: 'Location Category', sdcType: 'XdString', seq: '0000', description: 'A kind or functional description of a location. NIEM 6.0 nc:LocationCategoryText.', maxLength: '4000' }),
  (comp_zlqtx5yr8wdxavl2hc4y9uq4:XdString:SDC4Component { id: 'mc-zlqtx5yr8wdxavl2hc4y9uq4', label: 'Location Description', sdcType: 'XdString', seq: '0000', description: 'A description of a location. NIEM 6.0 nc:LocationDescriptionText.', maxLength: '4000' }),
  (comp_fwusqzhkfgeh7gwrsgihp0rx:XdString:SDC4Component { id: 'mc-fwusqzhkfgeh7gwrsgihp0rx', label: 'Location Directions', sdcType: 'XdString', seq: '0000', description: 'A set of directions to a location. NIEM 6.0 nc:LocationDirectionsText.', maxLength: '4000' }),
  (comp_c9n7299dj2fdzlmqe8ixvb2z:XdString:SDC4Component { id: 'mc-c9n7299dj2fdzlmqe8ixvb2z', label: 'Location Identification', sdcType: 'XdString', seq: '0000', description: 'An identification of a Location. NIEM 6.0 nc:LocationIdentification. The identifier value (nc:IdentificationID).', maxLength: '64' }),
  (comp_vw3tuujru1u95k6kavnc946v:XdString:SDC4Component { id: 'mc-vw3tuujru1u95k6kavnc946v', label: 'Location Landmark Name', sdcType: 'XdString', seq: '0000', description: 'A name of a landmark. NIEM 6.0 nc:LocationLandmarkName.', maxLength: '255' }),
