  (cluster_n1t42tkwjrpukvnqog59mvh4:Cluster:SDC4Component { id: 'mc-n1t42tkwjrpukvnqog59mvh4', label: 'Cargo Manifest', sdcType: 'Cluster', description: 'The cargo declared for a port call: the NIEM cargo (category, weights, volumes, customs value, hazmat declaration with the UN/NA coded value, origin and destination), the container count and the shipper\'s business registry number. Members: m-cargo (NIEM); Container Count; Business Registry Number.' }),
