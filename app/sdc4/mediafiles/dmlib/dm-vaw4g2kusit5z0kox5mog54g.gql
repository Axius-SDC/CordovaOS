  // --- Model-enriched structural data ---
  (dm_vaw4g2kusit5z0kox5mog54g:DataModel { id: 'dm-vaw4g2kusit5z0kox5mog54g', label: 'Tax and Revenue Record', sdcType: 'DataModel', description: 'Record all tax filings, assessments, and revenue collection for Cordova.', dcSubject: 'Tax Filing', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_pilbutha60g9r6v40hzcn4c8:Cluster:SDC4Component { id: 'mc-pilbutha60g9r6v40hzcn4c8', label: 'Tax and Revenue Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed tax and revenue record in CordovaOS: a taxpayer\'s filings and revenue transactions. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_hdhjfg00tngir2txgqyka9cv:Cluster:SDC4Component { id: 'mc-hdhjfg00tngir2txgqyka9cv', label: 'Provenance Components', sdcType: 'Cluster', description: 'Cluster for Provenance Components' }),
  (comp_m9xg6e182m1oq77ssrf9iujv:XdString:SDC4Component { id: 'mc-m9xg6e182m1oq77ssrf9iujv', label: 'activity_description', sdcType: 'XdString', seq: '0000', description: 'Detailed description of what this activity does and its purpose.', minLength: '1', maxLength: '2000' }),
  (comp_ccj1yq2wtwknobszkgzzdbtr:XdString:SDC4Component { id: 'mc-ccj1yq2wtwknobszkgzzdbtr', label: 'prov_activity_type', sdcType: 'XdString', seq: '0000', description: 'Type of activity from the W3C Activity Streams 2.0 vocabulary. Describes what was done to the data.', minLength: '1', maxLength: '200' }),
  (comp_bd3s8t23d6m3zizmpwavc32y:XdString:SDC4Component { id: 'mc-bd3s8t23d6m3zizmpwavc32y', label: 'system_identifier', sdcType: 'XdString', seq: '0000', description: 'Identifier of the system that handled the data. Maps to prov:Entity context in the PROV-O export. This is the AuditType.system-id field.', minLength: '1', maxLength: '50' }),
  (comp_zr59goe24qkocprl3feul3mt:XdString:SDC4Component { id: 'mc-zr59goe24qkocprl3feul3mt', label: 'system_location_identifier', sdcType: 'XdString', seq: '0000', description: 'Code or identifier for the system location. Used for cross-system location resolution.', minLength: '1', maxLength: '50' }),
  (comp_fnodzqkbyskwe7nh58rs336k:XdString:SDC4Component { id: 'mc-fnodzqkbyskwe7nh58rs336k', label: 'system_location_name', sdcType: 'XdString', seq: '0000', description: 'Name of the physical or logical location where the system resides. Maps to prov:atLocation.', minLength: '1', maxLength: '100' }),
  (comp_edvvjznmaoibzmfna0uuoo37:XdTemporal:SDC4Component { id: 'mc-edvvjznmaoibzmfna0uuoo37', label: 'activity_timestamp_end', sdcType: 'XdTemporal', seq: '0000', description: 'When the provenance activity completed. Maps to prov:endedAtTime. ISO 8601 format.' }),
  (comp_o72s5793973fzho35rnaughs:XdTemporal:SDC4Component { id: 'mc-o72s5793973fzho35rnaughs', label: 'activity_timestamp_start', sdcType: 'XdTemporal', seq: '0000', description: 'When the provenance activity began. Maps to prov:startedAtTime. ISO 8601 format.' }),
  (cluster_w9v4eo1l0wy5r65tqx5mjyxh:Cluster:SDC4Component { id: 'mc-w9v4eo1l0wy5r65tqx5mjyxh', label: 'Tax Filing', sdcType: 'Cluster', description: 'A single tax filing for an individual or business.\nBusiness Context: Links to Civil Registry (individual) or Business Registry (business)\nPurpose: Document a tax filing with type, period, amounts, and payment status' }),
  (comp_a2yks4n49m6gcgpa7qc9hyg1:XdString:SDC4Component { id: 'mc-a2yks4n49m6gcgpa7qc9hyg1', label: 'Filing ID', sdcType: 'XdString', seq: '0000', description: 'Unique identifier for this tax filing', minLength: '1', maxLength: '50' }),
  (comp_hwmy9yj7cbhe94pjnq0n2oo5:XdToken:SDC4Component { id: 'mc-hwmy9yj7cbhe94pjnq0n2oo5', label: 'Tax Filing Status', sdcType: 'XdToken', seq: '0000', description: 'Filing status for annual Cordova tax returns.', enumerations: 'Individual; Joint; Business; Estate' }),
  (comp_zb956wxcjf1fccvqezivgrv7:XdToken:SDC4Component { id: 'mc-zb956wxcjf1fccvqezivgrv7', label: 'Tax Type', sdcType: 'XdToken', seq: '0000', description: 'Category of tax being filed', enumerations: 'Income Tax; Business Tax; Property Tax; Port Fee; Fine Collection; Import Duty' }),
  (comp_cuazcmxeeo8osfybrgdpe9g7:XdTemporal:SDC4Component { id: 'mc-cuazcmxeeo8osfybrgdpe9g7', label: 'Filing Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the filing was submitted' }),
  (cluster_j4drl0w17dmw49maf3swgi18:Cluster:SDC4Component { id: 'mc-j4drl0w17dmw49maf3swgi18', label: 'Payment', sdcType: 'Cluster', description: 'Payment records for the tax filing.\nPurpose: Track payments against tax assessments\nParent Cluster: Tax Filing' }),
  (comp_fqgaf7s7gkwi6j4hh88meudp:XdToken:SDC4Component { id: 'mc-fqgaf7s7gkwi6j4hh88meudp', label: 'Payment Method', sdcType: 'XdToken', seq: '0000', description: 'How the payment was made', enumerations: 'Bank Transfer; Check; Cash; Payroll Deduction' }),
  (comp_vt5nh89ol3g5gj0oz35tl6y0:XdToken:SDC4Component { id: 'mc-vt5nh89ol3g5gj0oz35tl6y0', label: 'Payment Status', sdcType: 'XdToken', seq: '0000', description: 'Whether the fee has been paid', enumerations: 'Paid; Invoiced; Overdue' }),
  (comp_tzrg36a15rigk48nj20sbw4v:XdQuantity:SDC4Component { id: 'mc-tzrg36a15rigk48nj20sbw4v', label: 'Payment Amount', sdcType: 'XdQuantity', seq: '0000', description: 'Tax payment amount received in Cordova Córdoba. Records the actual amount remitted by the taxpayer for a specific tax filing period.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '14', fractionDigits: '2' }),
  (comp_u18l77xlj2omcbmnpi5j7fff:Units:SDC4Component { id: 'mc-u18l77xlj2omcbmnpi5j7fff', label: 'Cordova Córdoba (COR)', sdcType: 'Units' }),
  (comp_xrjzng8dyk9eveyzi03abuhr:XdTemporal:SDC4Component { id: 'mc-xrjzng8dyk9eveyzi03abuhr', label: 'Payment Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date payment was received' }),
  (cluster_kwb0rpk8stxtaitb7k5hahlq:Cluster:SDC4Component { id: 'mc-kwb0rpk8stxtaitb7k5hahlq', label: 'Source Reference', sdcType: 'Cluster', description: 'Links this tax filing to its originating domain record.\nBusiness Context: Enables graph queries from tax revenue back to the source domain\nPurpose: Trace the provenance of tax revenue back to the originating transaction\nParent Cluster: Tax Filing' }),
  (comp_hcfz6urx5c2ayvt8npjl0t4l:XdString:SDC4Component { id: 'mc-hcfz6urx5c2ayvt8npjl0t4l', label: 'Source Record ID', sdcType: 'XdString', seq: '0000', description: 'Identifier of the originating record in the source domain (e.g., Port Call ID, Parcel Number, Incident Report Number)', minLength: '1', maxLength: '50' }),
  (comp_hh750k4i187bqzot5md216r1:XdToken:SDC4Component { id: 'mc-hh750k4i187bqzot5md216r1', label: 'Source Domain', sdcType: 'XdToken', seq: '0000', description: 'The domain that generated this tax obligation', enumerations: 'Employment; Business Registry; Property Registry; Maritime; Law Enforcement' }),
  (cluster_ekmjsthf4vkzcff9pwodqg5n:Cluster:SDC4Component { id: 'mc-ekmjsthf4vkzcff9pwodqg5n', label: 'Tax Assessment', sdcType: 'Cluster', description: 'Tax amounts assessed and due.\nPurpose: Record the financial details of the tax assessment\nParent Cluster: Tax Filing' }),
  (comp_q1sbdhsdk8glmdr8q1x3mlte:XdQuantity:SDC4Component { id: 'mc-q1sbdhsdk8glmdr8q1x3mlte', label: 'Taxable Income', sdcType: 'XdQuantity', seq: '0000', description: 'Gross income minus allowable deductions for the filing period in Cordova Córdoba. Serves as the base amount for tax rate application.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '14', fractionDigits: '2' }),
  (comp_l5t2s5y0m4ybwom4ryndzaf9:XdQuantity:SDC4Component { id: 'mc-l5t2s5y0m4ybwom4ryndzaf9', label: 'Tax Assessment Amount', sdcType: 'XdQuantity', seq: '0000', description: 'Total tax liability assessed for the filing period in Cordova Córdoba. Calculated by the Tax Authority based on taxable income, applicable rates, and deductions.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '14', fractionDigits: '2' }),
