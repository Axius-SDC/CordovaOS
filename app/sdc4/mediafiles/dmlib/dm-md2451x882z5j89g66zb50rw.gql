  (dm_md2451x882z5j89g66zb50rw:DataModel { id: 'dm-md2451x882z5j89g66zb50rw', label: 'Maritime Port Authority', sdcType: 'DataModel', description: 'Record all maritime operations, vessel movements, crew, cargo, and customs at Porto Sereno.', dcSubject: 'Maritime Port Call', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_haoricee7rjlcybdp70akw9l:Cluster:SDC4Component { id: 'mc-haoricee7rjlcybdp70akw9l', label: 'Maritime Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed maritime-port record in CordovaOS: a vessel call and its cargo manifest. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_i8cjmvihdces5rqvb2snqwmo:Cluster:SDC4Component { id: 'mc-i8cjmvihdces5rqvb2snqwmo', label: 'Port Call Record', sdcType: 'Cluster', description: 'A single port call — one vessel arriving at and departing from Porto Sereno.\nBusiness Context: Primary operational record for port authority. Links to cargo, crew, fees, and customs.\nPurpose: Document a vessel\'s visit to Porto Sereno with all associated records', asserts: 'not(celbth0njlsg7503hod1qdei/xdtemporal-datetime) or yo3kxxvvx6do000l74kyozkn/xdtemporal-datetime le celbth0njlsg7503hod1qdei/xdtemporal-datetime' }),
  (comp_k7a0poa5c7co38oc65i6jppo:XdString:SDC4Component { id: 'mc-k7a0poa5c7co38oc65i6jppo', label: 'Flag State', sdcType: 'XdString', seq: '0000', description: 'Country of vessel registration (flag state)', minLength: '1', maxLength: '200' }),
  (comp_pbfvurdvio38rt6puifhippe:XdString:SDC4Component { id: 'mc-pbfvurdvio38rt6puifhippe', label: 'Port Call ID', sdcType: 'XdString', seq: '0000', description: 'Unique identifier for this port call record. Assigned by Porto Sereno Port Authority.', minLength: '1', maxLength: '50' }),
  (comp_lnjzw0racjo2oxol5w82tp1y:XdString:SDC4Component { id: 'mc-lnjzw0racjo2oxol5w82tp1y', label: 'Berth Assignment', sdcType: 'XdString', seq: '0000', description: 'Planned berth assignment for a vessel at port.', minLength: '1', maxLength: '200' }),
  (comp_gxt0t3cs4u6v5ob55qkc6ha0:XdString:SDC4Component { id: 'mc-gxt0t3cs4u6v5ob55qkc6ha0', label: 'Next Port of Call', sdcType: 'XdString', seq: '0000', description: 'Next port after this arrival', minLength: '1', maxLength: '200' }),
  (comp_s0qun9zalf98t3ffsefh34rj:XdString:SDC4Component { id: 'mc-s0qun9zalf98t3ffsefh34rj', label: 'Port of Departure', sdcType: 'XdString', seq: '0000', description: 'Last port of departure', minLength: '1', maxLength: '200' }),
  (comp_qlqdwbglcq4v3rg8i8iy7dk0:XdString:SDC4Component { id: 'mc-qlqdwbglcq4v3rg8i8iy7dk0', label: 'Vessel Call Sign', sdcType: 'XdString', seq: '0000', description: 'Vessel radio call sign', minLength: '1', maxLength: '50' }),
  (comp_ycy71t767wlyqma97o82r2m9:XdString:SDC4Component { id: 'mc-ycy71t767wlyqma97o82r2m9', label: 'Vessel IMO Number', sdcType: 'XdString', seq: '0000', description: 'International Maritime Organization (IMO) number', exactLength: '7', pattern: '\\d{7}' }),
  (comp_cl1hiqht7tm42a8lh8c4c1hz:XdString:SDC4Component { id: 'mc-cl1hiqht7tm42a8lh8c4c1hz', label: 'Vessel MMSI', sdcType: 'XdString', seq: '0000', description: 'Maritime Mobile Service Identity (MMSI) number', exactLength: '9', pattern: '\\d{9}' }),
  (comp_s5zeapfup3xdj6wbqjjkf1nd:XdString:SDC4Component { id: 'mc-s5zeapfup3xdj6wbqjjkf1nd', label: 'Vessel Name', sdcType: 'XdString', seq: '0000', description: 'Name of vessel (XdString)', minLength: '1', maxLength: '200' }),
  (comp_bmoixtn8r8pu62gbgd1tl8qn:XdString:SDC4Component { id: 'mc-bmoixtn8r8pu62gbgd1tl8qn', label: 'Voyage Number', sdcType: 'XdString', seq: '0000', description: 'Voyage or trip identifier', minLength: '1', maxLength: '50' }),
  (comp_bfaa3m23ye8q0qphv0x24if6:XdToken:SDC4Component { id: 'mc-bfaa3m23ye8q0qphv0x24if6', label: 'Cargo Type', sdcType: 'XdToken', seq: '0000', description: 'Primary type of cargo', enumerations: 'containers; bulk_dry; bulk_liquid; vehicles; general_cargo; refrigerated; livestock; none' }),
  (comp_lyh7y1in5j9ka5cxk2zw2qdj:XdToken:SDC4Component { id: 'mc-lyh7y1in5j9ka5cxk2zw2qdj', label: 'Purpose of Call', sdcType: 'XdToken', seq: '0000', description: 'Purpose of port call', enumerations: 'load_cargo; discharge_cargo; load_discharge; refuel; provisions; repairs; crew_change; emergency; other' }),
  (comp_p5qzw565y1dm5f3s6lg2q3ft:XdCount:SDC4Component { id: 'mc-p5qzw565y1dm5f3s6lg2q3ft', label: 'Crew Count', sdcType: 'XdCount', seq: '0000', description: 'Total number of crew members aboard the vessel at time of port call. Required for immigration processing, shore leave management, and emergency muster planning.', minInclusive: '1.00000', totalDigits: '4' }),
  (comp_qb5xnfq8e7qzlxr2q1sc5qhy:Units:SDC4Component { id: 'mc-qb5xnfq8e7qzlxr2q1sc5qhy', label: 'Persons', sdcType: 'Units' }),
  (comp_x720xrlooqij75bk26pvzrtl:XdCount:SDC4Component { id: 'mc-x720xrlooqij75bk26pvzrtl', label: 'Passenger Count', sdcType: 'XdCount', seq: '0000', description: 'Total number of passengers aboard the vessel at time of port call. Required for immigration processing, disembarkation planning, and port facility capacity management. Zero for cargo-only vessels.', minInclusive: '0.00000', totalDigits: '5' }),
  (comp_xccdfbmuqcy5yzv2n6ef0hrs:XdQuantity:SDC4Component { id: 'mc-xccdfbmuqcy5yzv2n6ef0hrs', label: 'Vessel Draft', sdcType: 'XdQuantity', seq: '0000', description: 'Maximum draft (depth below waterline) of the vessel in meters at time of port entry. Critical for channel and berth depth clearance at Porto Sereno harbor.', minInclusive: '0.50000', maxInclusive: '30.00000', totalDigits: '5', fractionDigits: '2' }),
  (comp_y28mhe3jdzi9b8ztn3fxodtf:Units:SDC4Component { id: 'mc-y28mhe3jdzi9b8ztn3fxodtf', label: 'Length/Distance (SI - Metric)', sdcType: 'Units' }),
  (comp_wtph0sqt244h38lyzf9ot1op:XdQuantity:SDC4Component { id: 'mc-wtph0sqt244h38lyzf9ot1op', label: 'Vessel Gross Tonnage', sdcType: 'XdQuantity', seq: '0000', description: 'Vessel\'s gross tonnage as registered under the IMO Tonnage Convention (1969). Determines applicable port fees, pilotage requirements, and berth assignment at Porto Sereno.', minInclusive: '1.00000', totalDigits: '8', fractionDigits: '0' }),
  (comp_qq516wt8ynu4jny0dn2no51n:Units:SDC4Component { id: 'mc-qq516wt8ynu4jny0dn2no51n', label: 'Gross Tonnage', sdcType: 'Units' }),
  (comp_jnxxwzl046rkmkbtm33naueu:XdQuantity:SDC4Component { id: 'mc-jnxxwzl046rkmkbtm33naueu', label: 'Vessel Length Overall', sdcType: 'XdQuantity', seq: '0000', description: 'Length overall (LOA) of the vessel in meters, measured from the foremost to the aftermost point. Required for berth assignment and pilotage planning at Porto Sereno.', minInclusive: '1.00000', maxInclusive: '500.00000', totalDigits: '6', fractionDigits: '2' }),
  (comp_lh0ufebnovngzzgfggud6ae6:XdQuantity:SDC4Component { id: 'mc-lh0ufebnovngzzgfggud6ae6', label: 'Vessel Net Tonnage', sdcType: 'XdQuantity', seq: '0000', description: 'Vessel\'s net tonnage as registered under the IMO Tonnage Convention (1969). Represents usable cargo capacity. Used for canal transit fees and some port tariff calculations.', minInclusive: '1.00000', totalDigits: '8', fractionDigits: '0' }),
  (comp_rln82e53qjn6zo832iuyfgng:Units:SDC4Component { id: 'mc-rln82e53qjn6zo832iuyfgng', label: 'Net Tonnage', sdcType: 'Units' }),
  (comp_upvi6l9pyb4f0p4vfunietsw:XdTemporal:SDC4Component { id: 'mc-upvi6l9pyb4f0p4vfunietsw', label: 'Arrival Date/Time', sdcType: 'XdTemporal', seq: '0000', description: 'Date and time the vessel arrived at Porto Sereno' }),
  (comp_sqpcl9uk7sze8bdqxxqwuqrn:XdTemporal:SDC4Component { id: 'mc-sqpcl9uk7sze8bdqxxqwuqrn', label: 'Departure Date/Time', sdcType: 'XdTemporal', seq: '0000', description: 'Date and time the vessel departed Porto Sereno. Null if vessel is currently in port.\n\n---' }),
  (cluster_ibb8e7c8equpeqiv5wxrxxll:Cluster:SDC4Component { id: 'mc-ibb8e7c8equpeqiv5wxrxxll', label: 'Cargo Manifest', sdcType: 'Cluster', description: 'Cargo loaded or discharged during this port call.\nPurpose: Record cargo movements for customs, safety, and tax purposes\nParent Cluster: Port Call Record', asserts: 'not(thvljji7xel3ac8axyloowk0/true-value) or boolean(nnw8ypv95rfo7jmso42wa4fc)' }),
  (comp_wxjyv4dmwb0rws14mn5xy3ju:XdBoolean:SDC4Component { id: 'mc-wxjyv4dmwb0rws14mn5xy3ju', label: 'Customs Declaration Filed', sdcType: 'XdBoolean', seq: '0000', description: 'Whether customs declaration has been filed' }),
  (comp_n7x39orkbwjejdf8r93trlaa:XdBoolean:SDC4Component { id: 'mc-n7x39orkbwjejdf8r93trlaa', label: 'Hazardous Cargo', sdcType: 'XdBoolean', seq: '0000', description: 'Whether vessel is carrying hazardous materials' }),
  (comp_l8f0m7op4xhrxqy1jrnvbuly:XdString:SDC4Component { id: 'mc-l8f0m7op4xhrxqy1jrnvbuly', label: 'Business Registry Number', sdcType: 'XdString', seq: '0000', description: 'Cordova Business Registration Number. Format: BIZ-NNNNNN where NNNNNN is a six-digit sequence number assigned at incorporation. Required for all business filings, tax records, and port authority transactions.', exactLength: '10', pattern: 'BIZ-[0-9]{6}' }),
  (comp_z7zqo56erimvk8dqvl07ihfr:XdString:SDC4Component { id: 'mc-z7zqo56erimvk8dqvl07ihfr', label: 'Cargo Description', sdcType: 'XdString', seq: '0000', description: 'Description of cargo contents', minLength: '1', maxLength: '200' }),
  (comp_an9kafb2l1enwh20ngvo1n7y:XdString:SDC4Component { id: 'mc-an9kafb2l1enwh20ngvo1n7y', label: 'Cargo Destination', sdcType: 'XdString', seq: '0000', description: 'Final destination for this cargo (may be Porto Sereno or transshipment)', minLength: '1', maxLength: '200' }),
  (comp_rt510ljj3vz05fxwcm85i990:XdString:SDC4Component { id: 'mc-rt510ljj3vz05fxwcm85i990', label: 'Cargo Origin', sdcType: 'XdString', seq: '0000', description: 'Port or country of origin for this cargo', minLength: '1', maxLength: '200' }),
  (comp_dp1dkn09vydj2ss6ho37kyhv:XdString:SDC4Component { id: 'mc-dp1dkn09vydj2ss6ho37kyhv', label: 'Customs Reference Number', sdcType: 'XdString', seq: '0000', description: 'Customs filing reference number', minLength: '1', maxLength: '50' }),
  (comp_gqbvto3l0o5e6uorrgjwdig2:XdToken:SDC4Component { id: 'mc-gqbvto3l0o5e6uorrgjwdig2', label: 'Hazmat Class', sdcType: 'XdToken', seq: '0000', description: 'Hazardous material classes on board (if applicable)', enumerations: '1-explosives,2-gases,3-flammable-liquids,4-flammable-solids,5-oxidizers,6-toxic,7-radioactive,8-corrosives,9-misc' }),
  (comp_y5se2qd3r6xx6pz8t7d8cqvf:XdCount:SDC4Component { id: 'mc-y5se2qd3r6xx6pz8t7d8cqvf', label: 'Container Count', sdcType: 'XdCount', seq: '0000', description: 'Number of shipping containers in the cargo consignment measured in TEU (Twenty-foot Equivalent Units). Used for berth planning, crane allocation, and port throughput statistics.', minInclusive: '0.00000', totalDigits: '5' }),
  (comp_l4a5u5ed3qv9rc4rqv9cebqt:Units:SDC4Component { id: 'mc-l4a5u5ed3qv9rc4rqv9cebqt', label: 'Twenty-foot Equivalent Units (TEU)', sdcType: 'Units' }),
  (comp_lqqypwp22ohzb0ud3wq81r9s:XdQuantity:SDC4Component { id: 'mc-lqqypwp22ohzb0ud3wq81r9s', label: 'Cargo Weight', sdcType: 'XdQuantity', seq: '0000', description: 'Total weight of the cargo consignment in kilograms as declared on the bill of lading. Required for vessel stability calculations and port crane scheduling.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '10', fractionDigits: '2' }),
  (comp_tjxxdsd6idyzqygrncojauxn:Units:SDC4Component { id: 'mc-tjxxdsd6idyzqygrncojauxn', label: 'Mass/Weight (SI - Metric)', sdcType: 'Units' }),
  (cluster_emtr91lypy400ttgzz2ti4et:Cluster:SDC4Component { id: 'mc-emtr91lypy400ttgzz2ti4et', label: 'Port Fees', sdcType: 'Cluster', description: 'Financial charges for this port call. Links to Tax & Revenue domain.\nPurpose: Record port fees for billing, tax reporting, and financial auditing\nParent Cluster: Port Call Record' }),
