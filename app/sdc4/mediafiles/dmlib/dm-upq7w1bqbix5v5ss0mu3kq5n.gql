  (dm_upq7w1bqbix5v5ss0mu3kq5n:DataModel { id: 'dm-upq7w1bqbix5v5ss0mu3kq5n', label: 'Education Record', sdcType: 'DataModel', description: 'Track student enrollment and academic credentials at Cordova educational institutions.', dcSubject: 'Education Registry', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_j4t6xb94355k51xg87n8awdl:Cluster:SDC4Component { id: 'mc-j4t6xb94355k51xg87n8awdl', label: 'Education Governed Record', sdcType: 'Cluster', description: 'Root data cluster (DMType Item) for a governed education record in CordovaOS: a student\'s enrollment and academic history. Wraps the domain\'s data components with the shared W3C PROV-O Provenance cluster so each record carries its lineage bound alongside its data. Workflow, attestation, parties, and the system audit trail sit in the DMType\'s native governance slots; access control and retention apply as bound sdcgovernance policy.' }),
  (cluster_ifgq7a670csnbv7vcpuiabp0:Cluster:SDC4Component { id: 'mc-ifgq7a670csnbv7vcpuiabp0', label: 'Education Record', sdcType: 'Cluster', description: 'A student\'s enrollment or completed credential at an educational institution.\nBusiness Context: Links persons to campuses and academic programs\nPurpose: Document academic enrollment, program, and credential attainment' }),
  (comp_nj7s1gk45tfgyooxpz0qaha3:XdString:SDC4Component { id: 'mc-nj7s1gk45tfgyooxpz0qaha3', label: 'National ID (CID)', sdcType: 'XdString', seq: '0000', description: 'Cordova National Identity Number. Format: COR-PPCC-NNNNNN where PP is the two-letter province code (AL=Aldara, BR=Brevina, CE=Celara), CC is the two-digit city code (01-03), and NNNNNN is a six-digit sequence number. Issued at birth or naturalization. Required for all government transactions.', exactLength: '16', pattern: 'COR-(AL|BR|CE)0[1-3]-[0-9]{6}' }),
  (comp_khbvruwpu9hnttg8y0mnih6a:XdString:SDC4Component { id: 'mc-khbvruwpu9hnttg8y0mnih6a', label: 'Student ID', sdcType: 'XdString', seq: '0000', description: 'Institution-assigned student identifier', minLength: '1', maxLength: '50' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
  (cluster_nyf0w3u2hs0svcjnqkb6zzlb:Cluster:SDC4Component { id: 'mc-nyf0w3u2hs0svcjnqkb6zzlb', label: 'Credential', sdcType: 'Cluster', description: 'Academic degree, diploma, or certificate earned.\nPurpose: Record awarded credentials for verification and workforce qualification\nParent Cluster: Education Record' }),
  (comp_ht98owgvxhff3ge85i4h80lp:XdBoolean:SDC4Component { id: 'mc-ht98owgvxhff3ge85i4h80lp', label: 'Yes/No', sdcType: 'XdBoolean', seq: '0000', description: 'Standard Yes/No binary response for clinical data collection' }),
  (comp_ouqi09d8kjqeojlr7vnclysj:XdString:SDC4Component { id: 'mc-ouqi09d8kjqeojlr7vnclysj', label: 'Field of Study', sdcType: 'XdString', seq: '0000', description: 'Major field of study', minLength: '1', maxLength: '200' }),
