  // --- Model-enriched structural data ---
  (dm_zdhuex1xwf8s5niriw878e0o:DataModel { id: 'dm-zdhuex1xwf8s5niriw878e0o', label: 'Law Enforcement Record 4.4.0', sdcType: 'DataModel', description: 'Record public safety incidents, charges, and dispositions in Cordova.', dcSubject: 'Law Enforcement', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_bpo0qpdsr1pj7j9kphbiigg0:Cluster:SDC4Component { id: 'mc-bpo0qpdsr1pj7j9kphbiigg0', label: 'Law Enforcement Governed Record', sdcType: 'Cluster', description: 'A law enforcement record. The governed record: the data cluster, the PROV activity and agent and the audit event from the ProvGov library by identifier, and the digital signature proof. Members: Incident Report; prov-activity (Provgov); prov-agent (Provgov); audit-event (Provgov); Digital Signature Proof.' }),
  (comp_gug5dhtqfv7exbgmm2raxpkq:XdFile:SDC4Component { id: 'mc-gug5dhtqfv7exbgmm2raxpkq', label: 'Digital Signature Proof', sdcType: 'XdFile', seq: '0000', description: 'Cryptographic proof of attestation (digital signature)' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
  (comp_dkc2ccj5te35z9gd4bu1blcq:XdString:SDC4Component { id: 'mc-dkc2ccj5te35z9gd4bu1blcq', label: 'Audit Agent Reference', sdcType: 'XdString', seq: '0000', description: 'The acting agent (FHIR AuditEvent.agent.who). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_gcjyjrnp0wsfoelcp4m05c67:XdString:SDC4Component { id: 'mc-gcjyjrnp0wsfoelcp4m05c67', label: 'Audit Entity Reference', sdcType: 'XdString', seq: '0000', description: 'The entity the event concerns (FHIR AuditEvent.entity.what). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_sjym80rxfdn9lm66ebe6s4tj:Cluster:SDC4Component { id: 'mc-sjym80rxfdn9lm66ebe6s4tj', label: 'Incident Report', sdcType: 'Cluster', description: 'A law enforcement incident: the subject\'s national ID, the NIEM incident (identification, date, description, location, category and status codes, the arrest with its charges and subject, evidence, officials), the Cordova incident status, city and province, the Cordova charge details and quarantine enforcement. Members: National ID (CID); j-incident (NIEM); Incident Status; City; Province; Charge Details (Cordova); Quarantine Enforcement.' }),
  (comp_nj7s1gk45tfgyooxpz0qaha3:XdString:SDC4Component { id: 'mc-nj7s1gk45tfgyooxpz0qaha3', label: 'National ID (CID)', sdcType: 'XdString', seq: '0000', description: 'Cordova National Identity Number. Format: COR-PPCC-NNNNNN where PP is the two-letter province code (AL=Aldara, BR=Brevina, CE=Celara), CC is the two-digit city code (01-03), and NNNNNN is a six-digit sequence number. Issued at birth or naturalization. Required for all government transactions.', exactLength: '16', pattern: 'COR-(AL|BR|CE)0[1-3]-[0-9]{6}' }),
  (comp_atdtdfzruh7tya0iv5cz365l:XdToken:SDC4Component { id: 'mc-atdtdfzruh7tya0iv5cz365l', label: 'City', sdcType: 'XdToken', seq: '0000', description: 'One of the nine cities in the Republic of Cordova.', enumerations: 'Porto Sereno; Vistamar; Rioseco; Campoluz; Tierraverde; Montecara; Novaciudad; Piedrasol; Lagunavista' }),
  (comp_e83h36jqgi59dhy1dttp22qm:XdToken:SDC4Component { id: 'mc-e83h36jqgi59dhy1dttp22qm', label: 'Incident Status', sdcType: 'XdToken', seq: '0000', description: 'Current status of the incident', enumerations: 'Open; Closed; Pending' }),
  (comp_kv5qqs3o4jwcwz9javgw1pzh:XdToken:SDC4Component { id: 'mc-kv5qqs3o4jwcwz9javgw1pzh', label: 'Province', sdcType: 'XdToken', seq: '0000', description: 'One of the three provinces of the Republic of Cordova. Used across civil registry, property, tax, and all geographic records.', enumerations: 'Aldara; Brevina; Celara' }),
  (cluster_ubibbfdz9n4erd93ud955i91:Cluster:SDC4Component { id: 'mc-ubibbfdz9n4erd93ud955i91', label: 'Charge Details (Cordova)', sdcType: 'Cluster', description: 'What the Cordova courts add to a NIEM charge: the fine or bail amount in Córdobas and the disposition date. Members: Fine or Bail Amount; Disposition Date.' }),
  (comp_yahksk4xc5to981ows7bpp6z:XdQuantity:SDC4Component { id: 'mc-yahksk4xc5to981ows7bpp6z', label: 'Fine or Bail Amount', sdcType: 'XdQuantity', seq: '0000', description: 'Monetary amount of the fine imposed or bail set for the charge in Cordova Córdoba. Null if no financial penalty applies or bail is denied.', minMagnitude: '0.00000', minInclusive: '0.00000', totalDigits: '12', fractionDigits: '2' }),
  (comp_u18l77xlj2omcbmnpi5j7fff:Units:SDC4Component { id: 'mc-u18l77xlj2omcbmnpi5j7fff', label: 'Cordova Córdoba (COR)', sdcType: 'Units' }),
  (comp_qse1jwofk5lm2wnsrn3f06l0:XdTemporal:SDC4Component { id: 'mc-qse1jwofk5lm2wnsrn3f06l0', label: 'Disposition Date', sdcType: 'XdTemporal', seq: '0000', description: 'Date the disposition was recorded\n\n---' }),
  (cluster_rf6fgthipruopc68iyyntrwq:Cluster:SDC4Component { id: 'mc-rf6fgthipruopc68iyyntrwq', label: 'Incident', sdcType: 'Cluster', description: 'A data type for an occurrence or an event that may require a response. NIEM 6.0 nc:IncidentType. Members: Activity Identification; Activity Date; Activity Description; Location (NIEM); Incident Category Code; Incident Category UCR Code; Incident General Category; Incident Status Code; Incident Level; Incident Dissemination Level Code; Incident Observation; Incident Day Period; Incident Reported Narrative; Incident Jurisdictional Organization Reference; Incident Log Identification; Incident Lighting Code; Incident Weather; Incident Issues; Incident Method Description; Incident Injury Level; Incident Arrest Made Indicator; Incident Arrest Count Quantity; Incident Criminal Indicator; Incident Force Involved Indicator; Incident Weapon Involved Indicator; Incident Traffic Accident Involved Indicator; Incident Emergency Service Required Indicator; Incident Law Enforcement Summoned Indicator; Incident Minor Involved Indicator; Incident Official Present Indicator; Incident Evidence Held Indicator; Incident Prints Requested Indicator; Incident Crisis Response Team Activated Indicator; Amber Alert Issued Indicator; Incident Exceptional Clearance Code; Incident Exceptional Clearance Date; Incident Reporting Official Reference; Incident Response Official Reference; Incident Supervising Official Reference; Incident Assisting Official Reference; Incident Response Organization Reference; Incident Subject Reference; Incident Victim Reference; Incident Witness Reference; Incident Subject Weapon Reference; Incident Damaged Item Reference; Incident Stolen Item Reference; Incident Recovered Item Reference; Incident Seized Item Reference; Incident Stolen Vehicle Quantity; Incident Recovered Vehicle Quantity; Incident Structures Entered Quantity; Incident Drug Reference; Incident Facility Reference; Arrest; Service Call; Evidence.' }),
  (comp_my0j51q0uv6gqcmnn9eogs3j:XdBoolean:SDC4Component { id: 'mc-my0j51q0uv6gqcmnn9eogs3j', label: 'Amber Alert Issued Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if an Amber Alert has been issued for this incident; false otherwise. NIEM 6.0 j:AmberAlertIssuedIndicator.' }),
  (comp_utme5aw5dmbhpkza104y97ez:XdBoolean:SDC4Component { id: 'mc-utme5aw5dmbhpkza104y97ez', label: 'Incident Arrest Made Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if an arrest was made due to the incident; false otherwise. NIEM 6.0 j:IncidentArrestMadeIndicator.' }),
  (comp_rqhz9link6i1z7y5j4hgh25u:XdBoolean:SDC4Component { id: 'mc-rqhz9link6i1z7y5j4hgh25u', label: 'Incident Criminal Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if an incident that occurred is criminal; false if an incident is non-criminal. NIEM 6.0 j:IncidentCriminalIndicator.' }),
  (comp_jrfffk73mqc8s51fagm6zzo5:XdBoolean:SDC4Component { id: 'mc-jrfffk73mqc8s51fagm6zzo5', label: 'Incident Crisis Response Team Activated Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if the crisis response team was activated to respond to the subject incident; false otherwise. NIEM 6.0 j:IncidentCrisisResponseTeamActivatedIndicator.' }),
  (comp_iouat1m1p92w6brtgnew78ct:XdBoolean:SDC4Component { id: 'mc-iouat1m1p92w6brtgnew78ct', label: 'Incident Emergency Service Required Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if emergency service was summoned for this incident; false otherwise. NIEM 6.0 j:IncidentEmergencyServiceRequiredIndicator.' }),
  (comp_nnmz7i5p79ox7i10uq58j23l:XdBoolean:SDC4Component { id: 'mc-nnmz7i5p79ox7i10uq58j23l', label: 'Incident Evidence Held Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if evidence was held due to this incident; false otherwise. NIEM 6.0 j:IncidentEvidenceHeldIndicator.' }),
  (comp_juefph9u0szxgnbdofjsxev8:XdBoolean:SDC4Component { id: 'mc-juefph9u0szxgnbdofjsxev8', label: 'Incident Force Involved Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if force was used in an incident; false otherwise. NIEM 6.0 j:IncidentForceInvolvedIndicator.' }),
  (comp_st5wkvrrezh7ebpcm66wzucm:XdBoolean:SDC4Component { id: 'mc-st5wkvrrezh7ebpcm66wzucm', label: 'Incident Law Enforcement Summoned Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if law enforcement was summoned for this incident; false otherwise. NIEM 6.0 j:IncidentLawEnforcementSummonedIndicator.' }),
  (comp_kh5yg8z64f4z2lm4cskxmyxt:XdBoolean:SDC4Component { id: 'mc-kh5yg8z64f4z2lm4cskxmyxt', label: 'Incident Minor Involved Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if an incident involved or employed a person under the legal age of an adult; false otherwise. NIEM 6.0 j:IncidentMinorInvolvedIndicator.' }),
  (comp_c4neua3ror7ax351chk85rxs:XdBoolean:SDC4Component { id: 'mc-c4neua3ror7ax351chk85rxs', label: 'Incident Official Present Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if an official was present when an incident occurred; false otherwise. NIEM 6.0 j:IncidentOfficialPresentIndicator.' }),
  (comp_lnz214ylxutpxpl6y18yvuai:XdBoolean:SDC4Component { id: 'mc-lnz214ylxutpxpl6y18yvuai', label: 'Incident Prints Requested Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if a request was made to gather fingerprints; false otherwise. NIEM 6.0 j:IncidentPrintsRequestedIndicator.' }),
  (comp_llps3bgkou8fij8j6hck2hz2:XdBoolean:SDC4Component { id: 'mc-llps3bgkou8fij8j6hck2hz2', label: 'Incident Traffic Accident Involved Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if an incident involved a traffic accident or crash; false otherwise. NIEM 6.0 j:IncidentTrafficAccidentInvolvedIndicator.' }),
  (comp_ky56sqir1rncy9vz62s9cygs:XdBoolean:SDC4Component { id: 'mc-ky56sqir1rncy9vz62s9cygs', label: 'Incident Weapon Involved Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'True if a weapon was used in an incident; false otherwise. NIEM 6.0 j:IncidentWeaponInvolvedIndicator.' }),
  (comp_ne1qtonwtz9mvujgchp46nfz:XdString:SDC4Component { id: 'mc-ne1qtonwtz9mvujgchp46nfz', label: 'Activity Description', sdcType: 'XdString', seq: '0000', description: 'A description of an activity. NIEM 6.0 nc:ActivityDescriptionText.', maxLength: '4000' }),
  (comp_g7bzqfrt27ftx37ptypizu23:XdString:SDC4Component { id: 'mc-g7bzqfrt27ftx37ptypizu23', label: 'Activity Identification', sdcType: 'XdString', seq: '0000', description: 'An identification that references an activity. NIEM 6.0 nc:ActivityIdentification. The identifier value (nc:IdentificationID).', maxLength: '64' }),
  (comp_h45w24ukeh17fq7th09kl9b0:XdString:SDC4Component { id: 'mc-h45w24ukeh17fq7th09kl9b0', label: 'Incident Assisting Official Reference', sdcType: 'XdString', seq: '0000', description: 'A peace official that assisted in processing an incident. NIEM 6.0 j:IncidentAssistingOfficial. Holds the IRI of the referenced Enforcement Official record.', maxLength: '2000', pattern: '\\S+' }),
