  // --- Model-enriched structural data ---
  (dm_dcsd8bxr8a6lzcptwwyms44t:DataModel { id: 'dm-dcsd8bxr8a6lzcptwwyms44t', label: 'Healthcare Record 4.4.0', sdcType: 'DataModel', description: 'Maintain basic medical records for all persons in Cordova.', dcSubject: 'Healthcare Record', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal', dcPublisher: 'Axius SDC, Inc.' }),
  (cluster_ffh1o5rta29osqbm0jg7a1l7:Cluster:SDC4Component { id: 'mc-ffh1o5rta29osqbm0jg7a1l7', label: 'Healthcare Governed Record', sdcType: 'Cluster', description: 'A healthcare record. The governed record: the data cluster, the PROV activity and agent and the audit event from the ProvGov library by identifier, and the digital signature proof. Members: Patient Record; prov-activity (Provgov); prov-agent (Provgov); audit-event (Provgov); Digital Signature Proof.' }),
  (comp_gug5dhtqfv7exbgmm2raxpkq:XdFile:SDC4Component { id: 'mc-gug5dhtqfv7exbgmm2raxpkq', label: 'Digital Signature Proof', sdcType: 'XdFile', seq: '0000', description: 'Cryptographic proof of attestation (digital signature)' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
  (comp_dkc2ccj5te35z9gd4bu1blcq:XdString:SDC4Component { id: 'mc-dkc2ccj5te35z9gd4bu1blcq', label: 'Audit Agent Reference', sdcType: 'XdString', seq: '0000', description: 'The acting agent (FHIR AuditEvent.agent.who). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_gcjyjrnp0wsfoelcp4m05c67:XdString:SDC4Component { id: 'mc-gcjyjrnp0wsfoelcp4m05c67', label: 'Audit Entity Reference', sdcType: 'XdString', seq: '0000', description: 'The entity the event concerns (FHIR AuditEvent.entity.what). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_yyrztf21qkyi0xk612rzxfzd:Cluster:SDC4Component { id: 'mc-yyrztf21qkyi0xk612rzxfzd', label: 'Patient Record', sdcType: 'Cluster', description: 'A patient\'s record: the national ID, the FHIR Patient (Default person demographics, medical record number, marital status, address, contact point by identifier), allergies and intolerances, conditions (SNOMED CT and ICD-10-CM coded values), medication orders (RxNorm), immunizations (CVX), encounters and the vital signs panel, all from the FHIR library by identifier. Members: National ID (CID); patient (FHIR); allergy-intolerance (FHIR); condition (FHIR); medication-order (FHIR); immunization (FHIR); encounter (FHIR); vital-signs-panel (FHIR).' }),
  (comp_nj7s1gk45tfgyooxpz0qaha3:XdString:SDC4Component { id: 'mc-nj7s1gk45tfgyooxpz0qaha3', label: 'National ID (CID)', sdcType: 'XdString', seq: '0000', description: 'Cordova National Identity Number. Format: COR-PPCC-NNNNNN where PP is the two-letter province code (AL=Aldara, BR=Brevina, CE=Celara), CC is the two-digit city code (01-03), and NNNNNN is a six-digit sequence number. Issued at birth or naturalization. Required for all government transactions.', exactLength: '16', pattern: 'COR-(AL|BR|CE)0[1-3]-[0-9]{6}' }),
  (cluster_yeaa0k87yietfbfonbr4wgqs:Cluster:SDC4Component { id: 'mc-yeaa0k87yietfbfonbr4wgqs', label: 'Allergy Intolerance', sdcType: 'Cluster', description: 'An allergy or intolerance: the allergen coded in SNOMED CT, category, type, clinical and verification status, criticality, dates, note and reactions.' }),
  (comp_q8unjlqm15pc443iclif64on:XdString:SDC4Component { id: 'mc-q8unjlqm15pc443iclif64on', label: 'Allergy Note', sdcType: 'XdString', seq: '0000', description: 'A note about the allergy. FHIR AllergyIntolerance.note.', maxLength: '4000' }),
  (comp_ludhh6euu3lc99wpik2pyjcc:XdToken:SDC4Component { id: 'mc-ludhh6euu3lc99wpik2pyjcc', label: 'Allergy Category', sdcType: 'XdToken', seq: '0000', description: 'The category of the substance. FHIR AllergyIntolerance.category; AllergyIntoleranceCategory, version 4.0.1.', enumerations: 'food; medication; environment; biologic' }),
  (comp_gvahkpl47rdq5nv27sokv05f:XdToken:SDC4Component { id: 'mc-gvahkpl47rdq5nv27sokv05f', label: 'Allergy Clinical Status', sdcType: 'XdToken', seq: '0000', description: 'The clinical status. FHIR AllergyIntolerance.clinicalStatus; AllergyIntolerance Clinical Status Codes, version 4.0.1.', enumerations: 'active; inactive; resolved' }),
  (comp_sku0vf9wdpful1lrthu2eyyd:XdToken:SDC4Component { id: 'mc-sku0vf9wdpful1lrthu2eyyd', label: 'Allergy Criticality', sdcType: 'XdToken', seq: '0000', description: 'The potential clinical harm of a future reaction. FHIR AllergyIntolerance.criticality; AllergyIntoleranceCriticality, version 4.0.1.', enumerations: 'low; high; unable-to-assess' }),
  (comp_pnuuxh2172pozj03h5hxyfgb:XdToken:SDC4Component { id: 'mc-pnuuxh2172pozj03h5hxyfgb', label: 'Allergy Type', sdcType: 'XdToken', seq: '0000', description: 'Allergy or intolerance. FHIR AllergyIntolerance.type; AllergyIntoleranceType, version 4.0.1.', enumerations: 'allergy; intolerance' }),
  (comp_p39nkyal7bbx36vs8raozozz:XdToken:SDC4Component { id: 'mc-p39nkyal7bbx36vs8raozozz', label: 'Allergy Verification Status', sdcType: 'XdToken', seq: '0000', description: 'The certainty of the allergy. FHIR AllergyIntolerance.verificationStatus; AllergyIntolerance Verification Status Codes, version 4.0.1.', enumerations: 'unconfirmed; confirmed; refuted; entered-in-error' }),
  (comp_lvms8v52hnfpiqinfbwwtw37:XdTemporal:SDC4Component { id: 'mc-lvms8v52hnfpiqinfbwwtw37', label: 'Allergy Onset Date', sdcType: 'XdTemporal', seq: '0000', description: 'When the allergy was identified. FHIR AllergyIntolerance.onsetDateTime.' }),
  (comp_ivpplvmgnxhdyqtax1ipdzwu:XdTemporal:SDC4Component { id: 'mc-ivpplvmgnxhdyqtax1ipdzwu', label: 'Allergy Recorded Date', sdcType: 'XdTemporal', seq: '0000', description: 'When the allergy was first recorded. FHIR AllergyIntolerance.recordedDate.' }),
  (comp_mrti6abfhdeferd4xsm9kz1b:XdTemporal:SDC4Component { id: 'mc-mrti6abfhdeferd4xsm9kz1b', label: 'Last Reaction Date', sdcType: 'XdTemporal', seq: '0000', description: 'When the last reaction occurred. FHIR AllergyIntolerance.lastOccurrence.' }),
  (cluster_rjzh4p0afw8eqsmfqvdlgh30:Cluster:SDC4Component { id: 'mc-rjzh4p0afw8eqsmfqvdlgh30', label: 'Allergen (SNOMED CT)', sdcType: 'Cluster', description: 'The substance or product responsible. A coded value: the SNOMED CT code, its display text and the fixed code system, resolved on the code system IRI (FHIR Coding). FHIR AllergyIntolerance.code.' }),
  (comp_q75pzzv36or6dxgjrrbvmun5:XdLink:SDC4Component { id: 'mc-q75pzzv36or6dxgjrrbvmun5', label: 'Code System: SNOMED CT', sdcType: 'XdLink', seq: '0000', description: 'The code system of a coded value, fixed: SNOMED CT (http://snomed.info/sct). FHIR Coding.system.' }),
  (comp_y16hwsqc3wjfn8pc16gnbdvv:XdString:SDC4Component { id: 'mc-y16hwsqc3wjfn8pc16gnbdvv', label: 'Allergen Code (SNOMED CT)', sdcType: 'XdString', seq: '0000', description: 'The SNOMED CT code for the substance or product responsible. FHIR AllergyIntolerance.code, coded in http://snomed.info/sct.', maxLength: '40', pattern: '[0-9]{6,18}' }),
  (comp_eo5tlfr0576ypknys5alvcn0:XdString:SDC4Component { id: 'mc-eo5tlfr0576ypknys5alvcn0', label: 'Code Display Text', sdcType: 'XdString', seq: '0000', description: 'The human-readable display of a coded value, as recorded with the code (FHIR Coding.display).', maxLength: '500' }),
  (cluster_t6s62iijsont6r7h2xss3i81:Cluster:SDC4Component { id: 'mc-t6s62iijsont6r7h2xss3i81', label: 'Allergy Reaction', sdcType: 'Cluster', description: 'A reaction event: manifestation, substance and exposure route coded in SNOMED CT, description, severity and onset.' }),
  (comp_mf5zu92mgdam65gs9djp1t4g:XdString:SDC4Component { id: 'mc-mf5zu92mgdam65gs9djp1t4g', label: 'Reaction Description', sdcType: 'XdString', seq: '0000', description: 'A description of the reaction. FHIR AllergyIntolerance.reaction.description.', maxLength: '4000' }),
  (comp_kmy0slqyv5ztfu0bevpz9zv1:XdToken:SDC4Component { id: 'mc-kmy0slqyv5ztfu0bevpz9zv1', label: 'Reaction Severity', sdcType: 'XdToken', seq: '0000', description: 'The severity of the reaction. FHIR AllergyIntolerance.reaction.severity; AllergyIntoleranceSeverity, version 4.0.1.', enumerations: 'mild; moderate; severe' }),
  (comp_m11tmjzf44tof6c48hnjxbz3:XdTemporal:SDC4Component { id: 'mc-m11tmjzf44tof6c48hnjxbz3', label: 'Reaction Onset', sdcType: 'XdTemporal', seq: '0000', description: 'When the reaction began. FHIR AllergyIntolerance.reaction.onset.' }),
  (cluster_dnxnysrxf7fa59c52bi6cowy:Cluster:SDC4Component { id: 'mc-dnxnysrxf7fa59c52bi6cowy', label: 'Exposure Route (SNOMED CT)', sdcType: 'Cluster', description: 'How the subject was exposed to the substance. A coded value: the SNOMED CT code, its display text and the fixed code system, resolved on the code system IRI (FHIR Coding). FHIR AllergyIntolerance.reaction.exposureRoute.' }),
